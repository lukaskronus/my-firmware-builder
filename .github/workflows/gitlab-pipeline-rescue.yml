name: Build ARMv7 + Multi-arch → GitLab Registry

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE:      ${{ secrets.GITLAB_REGISTRY_IMAGE }}       # goclaw-armv/goclaw
      IMAGE_ARMV7: ${{ secrets.GITLAB_REGISTRY_IMAGE_ARMV7 }} # goclaw-armv/goclaw-armv7
    steps:
      - name: Clone GitLab repo
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          REPO_URL: ${{ secrets.GITLAB_REPO_URL }}
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${GITLAB_TOKEN}" \
              clone --depth 1 "$REPO_URL" src
          cd src
          echo "Cloned $(git rev-parse --short HEAD)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}

      # ────────────────────────────────────────────────
      # ARMv7 — single-platform, one build, two tags
      # ────────────────────────────────────────────────
      - name: Build and push ARMv7 image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile.armv7
          platforms: linux/arm/v7
          push: true
          build-args: |
            ENABLE_EMBEDUI=true
            VERSION=armv7-baseline
          tags: |
            ${{ env.IMAGE_ARMV7 }}:armv7-baseline
            ${{ env.IMAGE_ARMV7 }}:latest
          cache-from: type=gha,scope=armv7
          cache-to: type=gha,mode=max,scope=armv7

      # ────────────────────────────────────────────────
      # AMD64 + ARM64 — multi-arch manifest
      # ────────────────────────────────────────────────
      - name: Build and push AMD64 + ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ENABLE_EMBEDUI=true
            VERSION=latest
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:multiarch-baseline
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
