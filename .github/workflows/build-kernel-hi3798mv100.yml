name: Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            libssl-dev libncurses5-dev \
            libelf-dev dwarves \
            pkg-config libglib2.0-dev \
            u-boot-tools git \
            ccache
      
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-hi3798mv100-${{ github.event.inputs.kernel_branch }}
          max-size: 2G
          save: true
          verbose: true
      
      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git \
            -b ${{ github.event.inputs.kernel_branch }} \
            --depth=1 kernel-source
          cd kernel-source
          echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Building from commit: $(git rev-parse HEAD)"
          cd ..
          CONFIG_HASH=$(sha256sum myrepo/config_files/hi3798mv100-dump.config | cut -d' ' -f1)
          echo "CONFIG_HASH=${CONFIG_HASH}" >> $GITHUB_ENV

      - name: Show ccache stats (before build)
        run: ccache --show-stats

      - name: Copy DTS & Config
        run: |
          cd kernel-source
          mkdir -p arch/arm/boot/dts/hisilicon
          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-a312.dts" \
             arch/arm/boot/dts/hisilicon/
          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.config" \
             .config
          echo 'dtb-$(CONFIG_ARCH_HISI) += hi3798mv100-a312.dtb' \
            >> arch/arm/boot/dts/hisilicon/Makefile
 
          # Verify the Makefile entry was added correctly
          echo "=== Last 3 lines of hisilicon Makefile ==="
          tail -3 arch/arm/boot/dts/hisilicon/Makefile

      
      - name: Kernel Configuration
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make olddefconfig
          ./scripts/config --enable CONFIG_OF
          ./scripts/config --enable CONFIG_OF_FLATTREE
          ./scripts/config --disable CONFIG_THUMB2_KERNEL
          ./scripts/config --enable CONFIG_ARM_APPENDED_DTB
          ./scripts/config --enable CONFIG_ARM_ATAG_DTB_COMPAT
          ./scripts/config --enable CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER
          make olddefconfig
          echo "=== Verifying critical config options ==="
          grep -E "THUMB2_KERNEL|ARM_APPENDED_DTB|ATAG_DTB_COMPAT" .config

      - name: Build Kernel
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          ccache --zero-stats
          make -j$(nproc) Image dtbs
          
          echo "=== Image size ==="
          ls -lh arch/arm/boot/Image

          echo "=== DTB files ==="
          ls -lh arch/arm/boot/dts/hisilicon/*.dtb
          
          ccache --show-stats

      - name: Build Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) modules
          ccache --show-stats

      - name: Install Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make modules_install INSTALL_MOD_PATH=./modules-staging
          find ./modules-staging -maxdepth 4 \
            \( -name "build" -o -name "source" \) \
            -type l -delete
          echo "=== Module staging size after cleanup ==="
          du -sh ./modules-staging

      - name: Create Bootable Image
        working-directory: ./kernel-source
        run: |
          cat arch/arm/boot/Image \
              arch/arm/boot/dts/hisilicon/hi3798mv100-a312.dtb \
              > Image-dtb
          
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x1FFFFC0 -e 0x1FFFFC0 \
            -n "Kernel 6.x for Hi3798Mv100" \
            -d Image-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100-${{ github.run_number }}-${{ env.KERNEL_VERSION }}
          path: |
            kernel-source/arch/arm/boot/Image
            kernel-source/uImage
            kernel-source/modules-staging/
          retention-days: 10
