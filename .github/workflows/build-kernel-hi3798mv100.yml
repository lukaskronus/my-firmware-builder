name: Build Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            libssl-dev libncurses5-dev \
            libelf-dev dwarves \
            pkg-config libglib2.0-dev \
            u-boot-tools git

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git \
            -b ${{ github.event.inputs.kernel_branch }} \
            --depth=1 kernel-source
          cd kernel-source
          echo "Building from commit: $(git rev-parse HEAD)"
      
      - name: Show Available Clock IDs
        run: |
          echo "=== histb-clock.h contents ==="
          cat kernel-source/include/dt-bindings/clock/histb-clock.h || echo "FILE NOT FOUND"

      - name: Copy DTS & Config
        run: |
          cd kernel-source
          mkdir -p arch/arm/boot/dts/hisilicon

          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.dts" \
             arch/arm/boot/dts/hisilicon/

          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.config" \
             .config

          # FIX 1: Correct Kconfig guard is CONFIG_ARCH_HISI, not CONFIG_ARCH_HISILICON.
          # FIX 2: DTB stem must exactly match the DTS filename (hi3798mv100-dump).
          echo 'dtb-$(CONFIG_ARCH_HISI) += hi3798mv100-dump.dtb' \
            >> arch/arm/boot/dts/hisilicon/Makefile

      - name: Kernel Configuration
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make olddefconfig

      - name: Build Kernel + DTB
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage dtbs

      - name: Build Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) modules

      - name: Install Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make modules_install INSTALL_MOD_PATH=./modules-staging

      - name: Clean up unnecessary files (build/source)
        working-directory: ./kernel-source
        run: |
          echo "Before cleanup size:"
          du -sh modules-staging/lib/modules/* || true
          
          rm -rf modules-staging/lib/modules/*/build
          rm -rf modules-staging/lib/modules/*/source
          
          echo "After cleanup size:"
          du -sh modules-staging/lib/modules/* || true

      - name: Create Bootable Image (Hisilicon)
        working-directory: ./kernel-source
        run: |
          # FIX 3: DTB filename here must also match the DTS stem.
          cat arch/arm/boot/zImage \
              arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb \
              > zImage-dtb

          mkimage -A arm -O linux -T kernel -C none \
            -a 0x2000000 -e 0x2000000 \
            -n "Kernel 6.x for Hi3798Mv100" \
            -d zImage-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100
          path: |
            kernel-source/arch/arm/boot/zImage
            kernel-source/zImage-dtb
            kernel-source/uImage
            kernel-source/arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb
            kernel-source/modules-staging/
            kernel-source/.config
            kernel-source/System.map
          retention-days: 30
