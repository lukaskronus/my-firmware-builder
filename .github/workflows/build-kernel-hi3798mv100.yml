name: Build Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            libssl-dev libncurses5-dev \
            libelf-dev dwarves \
            pkg-config libglib2.0-dev \
            u-boot-tools git \
            ccache

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git \
            -b ${{ github.event.inputs.kernel_branch }} \
            --depth=1 kernel-source
          cd kernel-source
          echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Building from commit: $(git rev-parse HEAD)"
          
          # Generate config hash for cache key
          cd ..
          CONFIG_HASH=$(sha256sum myrepo/config_files/hi3798mv100-dump.config | cut -d' ' -f1)
          echo "CONFIG_HASH=${CONFIG_HASH}" >> $GITHUB_ENV

      - name: Setup ccache
        run: |
          # Configure ccache before caching
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=cache_dir=$HOME/.ccache
          
          # Add ccache to PATH (this needs to persist)
          echo "$(dirname $(which ccache))" >> $GITHUB_PATH
          
          # Set ccache for cross-compilation
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=5G" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,file_macro" >> $GITHUB_ENV
          
          # Use ccache for gcc
          echo "CC=ccache arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # More precise cache key including config, branch, and toolchain version
          key: ccache-arm-${{ env.KERNEL_VERSION }}-${{ env.CONFIG_HASH }}-${{ runner.os }}-${{ github.event.inputs.kernel_branch }}-${{ env.KERNEL_COMMIT }}
          restore-keys: |
            ccache-arm-${{ env.KERNEL_VERSION }}-${{ env.CONFIG_HASH }}-${{ runner.os }}-${{ github.event.inputs.kernel_branch }}-
            ccache-arm-${{ env.KERNEL_VERSION }}-${{ env.CONFIG_HASH }}-${{ runner.os }}-
            ccache-arm-${{ env.KERNEL_VERSION }}-${{ env.CONFIG_HASH }}-
            ccache-arm-${{ env.KERNEL_VERSION }}-
            ccache-arm-

      - name: Show ccache stats (before build)
        run: ccache --show-stats

      - name: Show Available Clock IDs
        run: |
          echo "=== histb-clock.h contents ==="
          cat kernel-source/include/dt-bindings/clock/histb-clock.h || echo "FILE NOT FOUND"

      - name: Copy DTS & Config
        run: |
          cd kernel-source
          mkdir -p arch/arm/boot/dts/hisilicon
          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.dts" \
             arch/arm/boot/dts/hisilicon/
          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.config" \
             .config
          echo 'dtb-$(CONFIG_ARCH_HISI) += hi3798mv100-dump.dtb' \
            >> arch/arm/boot/dts/hisilicon/Makefile

      - name: Kernel Configuration
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          # Save timestamp to detect config changes
          CONFIG_TIMESTAMP=$(stat -c %Y .config 2>/dev/null || echo "0")
          
          # Run olddefconfig first to fill in all new symbols with defaults
          make olddefconfig
          
          # Disable Thumb2 kernel
          ./scripts/config --disable CONFIG_THUMB2_KERNEL
          
          # Re-run olddefconfig to resolve dependencies
          make olddefconfig
          
          echo "=== Verifying THUMB2_KERNEL is disabled ==="
          grep THUMB2_KERNEL .config
          
          # Force cache miss if config changed
          NEW_CONFIG_TIMESTAMP=$(stat -c %Y .config)
          if [ "$CONFIG_TIMESTAMP" != "$NEW_CONFIG_TIMESTAMP" ]; then
            echo "Config was modified, will affect cache"
          fi

      - name: Build Kernel + DTB
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          # Use ccache statistics
          echo "Building with ccache..."
          ccache --zero-stats
          
          make -j$(nproc) zImage dtbs
          
          echo "=== ccache stats after kernel build ==="
          ccache --show-stats

      - name: Build Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          
          make -j$(nproc) modules
          
          echo "=== ccache stats after modules build ==="
          ccache --show-stats

      - name: Install Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make modules_install INSTALL_MOD_PATH=./modules-staging
          
          # Remove build/ and source/ symlinks
          find ./modules-staging -maxdepth 4 \
            \( -name "build" -o -name "source" \) \
            -type l -delete
          
          echo "=== Module staging size after cleanup ==="
          du -sh ./modules-staging

      - name: Show final ccache stats
        run: |
          ccache --show-stats
          echo "Cache directory size:"
          du -sh ~/.ccache

      - name: Create Bootable Image
        working-directory: ./kernel-source
        run: |
          cat arch/arm/boot/zImage \
              arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb \
              > zImage-dtb
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x1FFFFC0 -e 0x1FFFFC0 \
            -n "Kernel 6.x for Hi3798Mv100" \
            -d zImage-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100-${{ github.run_number }}-${{ env.KERNEL_VERSION }}
          path: |
            kernel-source/arch/arm/boot/zImage
            kernel-source/zImage-dtb
            kernel-source/uImage
            kernel-source/arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb
            kernel-source/modules-staging/
            kernel-source/.config
            kernel-source/System.map
          retention-days: 30
