name: Build Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            device-tree-compiler libssl-dev libncurses5-dev libelf-dev \
            dwarves pkg-config libglib2.0-dev u-boot-tools git

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git -b ${{ github.event.inputs.kernel_branch }} --depth=1 kernel-source
          cd kernel-source
          echo "Building from commit: $(git rev-parse HEAD)"

      - name: Copy DTS & Config for FPT A312
        run: |
          cd kernel-source
          mkdir -p arch/arm/boot/dts/hisilicon
          
          # Copy DTS file to kernel source
          cp ${GITHUB_WORKSPACE}/config_files/hi3798mv100-dump.dts arch/arm/boot/dts/hisilicon/
          
          # Add new DTS to Makefile
          echo 'dtb-$(CONFIG_ARCH_HISILICON) += hi3798mv100-dump.dtb' >> arch/arm/boot/dts/hisilicon/Makefile

          # Use my config
          cp ${GITHUB_WORKSPACE}/config_files/hi3798mv100-dump.config .config

      - name: Kernel Configuration
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make olddefconfig

      - name: Build Kernel + DTB
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage dtbs

      - name: Build Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) modules

      - name: Create Bootable Image (Hisilicon)
        working-directory: ./kernel-source
        run: |
          cat arch/arm/boot/zImage arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb > zImage-dtb
          
          mkimage -A arm -O linux -T kernel -C none -a 0x2000000 -e 0x2000000 \
            -n "Kernel 6.x for Hi3798Mv100" -d zImage-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100
          path: |
            kernel-source/arch/arm/boot/zImage
            kernel-source/zImage-dtb
            kernel-source/uImage
            kernel-source/arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb
            kernel-source/lib/modules/
          retention-days: 30