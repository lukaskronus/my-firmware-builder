name: Build Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex make \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            libssl-dev libncurses5-dev \
            libelf-dev dwarves \
            pkg-config libglib2.0-dev \
            u-boot-tools git \
            ccache

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git \
            -b ${{ github.event.inputs.kernel_branch }} \
            --depth=1 kernel-source
          cd kernel-source
          echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
          echo "Building from commit: $(git rev-parse HEAD)"

      # Cache ccache directory.
      # Key includes the kernel version so a new upstream commit gets a
      # fresh cache instead of reusing stale object files from an older tree.
      # A restore-keys fallback still lets us warm-start from the previous
      # cache when only a few files changed.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-arm-${{ env.KERNEL_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-arm-${{ env.KERNEL_VERSION }}-
            ccache-arm-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --zero-stats
          # Prepend ccache wrappers so every arm-linux-gnueabihf-gcc call
          # goes through the cache transparently.
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Show Available Clock IDs
        run: |
          echo "=== histb-clock.h contents ==="
          cat kernel-source/include/dt-bindings/clock/histb-clock.h || echo "FILE NOT FOUND"

      - name: Copy DTS & Config
        run: |
          cd kernel-source
          mkdir -p arch/arm/boot/dts/hisilicon

          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.dts" \
             arch/arm/boot/dts/hisilicon/

          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.config" \
             .config

          echo 'dtb-$(CONFIG_ARCH_HISI) += hi3798mv100-dump.dtb' \
            >> arch/arm/boot/dts/hisilicon/Makefile

      - name: Kernel Configuration
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make olddefconfig

      - name: Build Kernel + DTB
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage dtbs

      - name: Build Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) modules

      - name: Install Modules
        working-directory: ./kernel-source
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make modules_install INSTALL_MOD_PATH=./modules-staging

          # Remove the build/ and source/ symlinks inside the installed module
          # tree — they point back into the kernel build directory on the runner
          # and are only needed for building out-of-tree modules, not for
          # running the firmware. Removing them saves significant artifact space.
          find ./modules-staging -maxdepth 4 \
            \( -name "build" -o -name "source" \) \
            -type l -delete

          echo "=== Module staging size after cleanup ==="
          du -sh ./modules-staging

      - name: Print ccache stats
        run: ccache --show-stats

      - name: Create Bootable Image
        working-directory: ./kernel-source
        run: |
          cat arch/arm/boot/zImage \
              arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb \
              > zImage-dtb

          mkimage -A arm -O linux -T kernel -C none \
            -a 0x1FFFFC0 -e 0x1FFFFC0 \
            -n "Kernel 6.x for Hi3798Mv100" \
            -d zImage-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100
          path: |
            kernel-source/arch/arm/boot/zImage
            kernel-source/zImage-dtb
            kernel-source/uImage
            kernel-source/arch/arm/boot/dts/hisilicon/hi3798mv100-dump.dtb
            kernel-source/modules-staging/
            kernel-source/.config
            kernel-source/System.map
          retention-days: 30
