name: Kernel for Hi3798Mv100

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch kernel source'
        required: true
        default: 'histb'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout My Repository
        uses: actions/checkout@v4
        with:
          path: myrepo

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            device-tree-compiler \
            libssl-dev libncurses5-dev \
            libelf-dev dwarves \
            u-boot-tools git \
            ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-kernel-hi3798mv100-${{ github.event.inputs.kernel_branch }}
          max-size: 2G
          save: true
          verbose: false

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/histb-mainline/linux.git \
            -b ${{ github.event.inputs.kernel_branch }} \
            --depth=1 kernel-source
          cd kernel-source
          echo "KERNEL_VERSION=$(make kernelversion)" >> $GITHUB_ENV
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure Kernel
        working-directory: ./kernel-source
        env:
          ARCH: arm
          CROSS_COMPILE: ccache arm-linux-gnueabihf-
        run: |
          cp "${GITHUB_WORKSPACE}/myrepo/config_files/hi3798mv100-dump.config" .config
          ./scripts/config \
            --enable  CONFIG_OF \
            --enable  CONFIG_OF_FLATTREE \
            --disable CONFIG_THUMB2_KERNEL \
            --enable  CONFIG_ARM_APPENDED_DTB \
            --enable  CONFIG_ARM_ATAG_DTB_COMPAT \
            --enable  CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER
          make olddefconfig

      - name: Build Kernel, DTBs and Modules
        working-directory: ./kernel-source
        env:
          ARCH: arm
          CROSS_COMPILE: ccache arm-linux-gnueabihf-
        run: |
          make -j$(nproc) zImage dtbs modules \
            KCFLAGS="-pipe" \
            KBUILD_BUILD_TIMESTAMP="" \
            KBUILD_BUILD_USER=ci \
            KBUILD_BUILD_HOST=github

      - name: Install Modules
        working-directory: ./kernel-source
        env:
          ARCH: arm
          CROSS_COMPILE: ccache arm-linux-gnueabihf-
        run: |
          make modules_install INSTALL_MOD_PATH=./modules-staging
          find ./modules-staging \( -name "build" -o -name "source" \) -type l -delete
          ccache --show-stats

      - name: Create Bootable Image
        working-directory: ./kernel-source
        run: |
          cat arch/arm/boot/zImage \
              arch/arm/boot/dts/hisilicon/hi3798mv100-ec6108v9c.dtb \
              > zImage-dtb
          mkimage -A arm -O linux -T kernel -C none \
            -a 0x1FFFFC0 -e 0x1FFFFC0 \
            -n "Kernel ${{ env.KERNEL_VERSION }} (${{ env.KERNEL_COMMIT }})" \
            -d zImage-dtb uImage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-hi3798mv100-${{ github.run_number }}-${{ env.KERNEL_VERSION }}
          path: |
            kernel-source/arch/arm/boot/zImage
            kernel-source/uImage
            kernel-source/modules-staging/
          retention-days: 10
