name: Build UBS static site

# Produces a portable static site from the UBS open-license data and publishes it
# as a Release asset. Download (stable URL):
#   https://github.com/${{ github.repository }}/releases/download/site/ubs-site.zip
# then extract into your nginx web root.

on:
  workflow_dispatch:
    inputs:
      shape:
        description: What to build
        type: choice
        default: Data drop + viewer (light)
        options:
          - Data drop + viewer (light)
          - Full generated site (per-entry pages)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        env:
          SHAPE: ${{ inputs.shape || 'Data drop + viewer (light)' }}
          UPSTREAM_SHA: ${{ github.sha }}
          UPSTREAM_REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """Build a portable static site from the UBS open-license data repo. Pure stdlib."""
          import os, re, json, html, shutil, xml.etree.ElementTree as ET

          SRC = os.environ.get("SRC", os.getcwd())
          OUT = os.environ.get("OUT", os.path.join(SRC, "dist"))
          SHAPE = os.environ.get("SHAPE", "Data drop + viewer (light)")
          UPSTREAM_SHA = os.environ.get("UPSTREAM_SHA", "")
          UPSTREAM_REF = os.environ.get("UPSTREAM_REF", "")
          REPO = os.environ.get("REPO", "")
          FULL = SHAPE.startswith("Full")

          ATTRIBUTION = ("Data \u00a9 United Bible Societies, licensed under "
                         "<a href='https://creativecommons.org/licenses/by-sa/4.0/'>CC BY-SA 4.0</a>.")

          def localname(tag): return tag.rsplit("}", 1)[-1]

          def slugify(name):
              base = os.path.splitext(os.path.basename(name))[0]
              base = base.replace("'", "").replace("\u2019", "").replace('"', "").lower()
              return re.sub(r"[^a-z0-9]+", "-", base).strip("-") or "item"

          def uniq_slug(used, key):
              base = slugify(key); slug = base; n = 2
              while slug in used:
                  slug = f"{base}-{n}"; n += 1
              used.add(slug); return slug


          def version_of(path):
              m = re.search(r"[-_]v?(\d+(?:[._]\d+)*)", os.path.basename(path))
              return m.group(1) if m else ""

          def pick_latest(paths):
              return sorted(paths, key=lambda p: [int(x) for x in re.findall(r"\d+", version_of(p))] or [0])[-1]

          def xml_to_obj(elem):
              children = list(elem)
              attrs = {localname(k): v for k, v in elem.attrib.items()}
              text = (elem.text or "").strip()
              if not children:
                  if attrs:
                      if text: attrs["#text"] = text
                      return attrs
                  return text
              obj = dict(attrs)
              for ch in children:
                  name = localname(ch.tag); val = xml_to_obj(ch)
                  if name in obj:
                      if not isinstance(obj[name], list): obj[name] = [obj[name]]
                      obj[name].append(val)
                  else: obj[name] = val
              if text: obj["#text"] = text
              return obj

          def load_xml(path): return xml_to_obj(ET.parse(path).getroot())

          INLINE_MAP = {"i": "em", "s": "span", "a": "a", "b": "strong"}

          def xml_to_html(elem):
              parts = []
              if elem.text: parts.append(html.escape(elem.text))
              for ch in elem:
                  tag = localname(ch.tag)
                  if tag == "Paragraph": parts.append(f"<p>{xml_to_html(ch)}</p>")
                  elif tag == "Heading": parts.append(f"<h3>{xml_to_html(ch)}</h3>")
                  elif tag == "SubHeading": parts.append(f"<h4>{xml_to_html(ch)}</h4>")
                  elif tag in INLINE_MAP:
                      ht = INLINE_MAP[tag]
                      if tag == "s": parts.append(f"<span class='sub'>{xml_to_html(ch)}</span>")
                      else: parts.append(f"<{ht}>{xml_to_html(ch)}</{ht}>")
                  else: parts.append(xml_to_html(ch))
                  if ch.tail: parts.append(html.escape(ch.tail))
              return "".join(parts)

          def write(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              mode = "wb" if isinstance(content, bytes) else "w"
              kw = {} if isinstance(content, bytes) else {"encoding": "utf-8"}
              with open(path, mode, **kw) as f: f.write(content)

          def write_json(path, obj): write(path, json.dumps(obj, ensure_ascii=False, separators=(",", ":")))
          def copy(src, dst):
              os.makedirs(os.path.dirname(dst), exist_ok=True); shutil.copy2(src, dst)
          def find(d, rx): return [os.path.join(d, f) for f in os.listdir(d) if re.match(rx, f)] if os.path.isdir(d) else []

          manifest = {"generatedFrom": {"sha": UPSTREAM_SHA, "ref": UPSTREAM_REF, "repo": REPO},
                      "shape": SHAPE, "resources": {}, "routes": [], "attribution": "CC BY-SA 4.0"}

          def copy_licenses():
              for root, _d, files in os.walk(SRC):
                  if ".git" in root.split(os.sep): continue
                  for f in files:
                      if f.upper() == "LICENSE.MD":
                          rel = os.path.relpath(os.path.join(root, f), SRC)
                          copy(os.path.join(root, f), os.path.join(OUT, "licenses", rel.replace(os.sep, "__")))

          def build_dictionaries():
              hdir = os.path.join(SRC, "dictionaries", "hebrew", "JSON")
              gdir = os.path.join(SRC, "dictionaries", "greek", "JSON")
              specs = [("hebrew", hdir, r"UBSHebrewDic-v[0-9.]+-en\.JSON$"),
                       ("hebrew-lexical-domains", hdir, r"UBSHebrewDicLexicalDomains-v[0-9.]+-en\.JSON$"),
                       ("hebrew-contextual-domains", hdir, r"UBSHebrewDicContextualDomains-v[0-9.]+-en\.JSON$"),
                       ("greek", gdir, r"UBSGreekNTDic-v[0-9.]+-en\.JSON$"),
                       ("greek-lexical-domains", gdir, r"UBSGreekNTDicLexicalDomains-v[0-9.]+-en\.JSON$")]
              out = {}
              for name, d, rx in specs:
                  cands = find(d, rx)
                  if not cands: continue
                  src = pick_latest(cands); rel = f"data/{name}.json"; copy(src, os.path.join(OUT, rel))
                  data = json.load(open(src, encoding="utf-8"))
                  count = len(data) if isinstance(data, list) else len(data.keys())
                  manifest["resources"][name] = {"file": rel, "version": version_of(src), "entries": count}
                  out[name] = (data, rel, version_of(src))
              return out

          def build_hottp():
              src = os.path.join(SRC, "HOTTP", "HOTTP.XML")
              if not os.path.isfile(src): return None
              entries = load_xml(src).get("HOTTP_Entry", [])
              if isinstance(entries, dict): entries = [entries]
              write_json(os.path.join(OUT, "data/hottp.json"), {"entries": entries})
              manifest["resources"]["hottp"] = {"file": "data/hottp.json", "entries": len(entries)}
              return entries

          def build_flora_fauna_realia():
              d = os.path.join(SRC, "flora-fauna-realia", "XML"); out = {}
              for kind in ("flora", "fauna", "realia"):
                  cands = find(d, rf"{kind.upper()}_[0-9.]+_en\.xml$")
                  if not cands: continue
                  src = pick_latest(cands); rel = f"data/{kind}.json"
                  entries = load_xml(src).get("ThemLex_Entry", [])
                  if isinstance(entries, dict): entries = [entries]
                  write_json(os.path.join(OUT, rel), {"entries": entries})
                  manifest["resources"][kind] = {"file": rel, "entries": len(entries), "version": version_of(src)}
                  out[kind] = (src, entries)
              return out

          def build_parallel():
              src = os.path.join(SRC, "parallel passages", "ParallelPassages.xml")
              if not os.path.isfile(src): return
              write_json(os.path.join(OUT, "data/parallel-passages.json"), load_xml(src))
              manifest["resources"]["parallel-passages"] = {"file": "data/parallel-passages.json"}

          def build_images():
              src = os.path.join(SRC, "images", "ubs-release.xml")
              if not os.path.isfile(src): return
              imgs = load_xml(src).get("BibleImage", [])
              if isinstance(imgs, dict): imgs = [imgs]
              write_json(os.path.join(OUT, "data/images.json"), {"images": imgs})
              manifest["resources"]["images"] = {"file": "data/images.json", "entries": len(imgs)}

          def build_marble_index():
              d = os.path.join(SRC, "index", "WLC", "JSON")
              if not os.path.isdir(d): return
              n = 0
              for f in sorted(os.listdir(d)):
                  if f.endswith(".json"):
                      copy(os.path.join(d, f), os.path.join(OUT, "data", "marble-links", f)); n += 1
              manifest["resources"]["marble-links"] = {"dir": "data/marble-links", "files": n}

          def build_routes():
              base = os.path.join(SRC, "ubs-bible-routes")
              gj, svg = os.path.join(base, "GeoJsonRoutes"), os.path.join(base, "SVG-Routes")
              if not os.path.isdir(gj): return
              used, routes = set(), []
              for f in sorted(os.listdir(gj)):
                  if not f.endswith(".geojson"): continue
                  base_name = os.path.splitext(f)[0]
                  title = base_name.split(".", 1)[-1].strip() if "." in base_name else base_name
                  s = uniq_slug(used, title)
                  rel_geo = f"routes/geojson/{s}.geojson"
                  copy(os.path.join(gj, f), os.path.join(OUT, rel_geo))
                  entry = {"id": base_name.split(".")[0].strip(), "title": title, "slug": s, "geojson": rel_geo}
                  svg_file = os.path.join(svg, base_name + ".svg")
                  if os.path.isfile(svg_file):
                      rel_svg = f"routes/svg/{s}.svg"; copy(svg_file, os.path.join(OUT, rel_svg)); entry["svg"] = rel_svg
                  routes.append(entry)
              write_json(os.path.join(OUT, "routes/routes.json"), routes); manifest["routes"] = routes
              meta = os.path.join(base, "metadata.csv")
              if os.path.isfile(meta): copy(meta, os.path.join(OUT, "routes/metadata.csv"))

          def entry_page(title, body):
              return (f"<!doctype html><html lang='en'><head><meta charset='utf-8'>"
                      f"<meta name='viewport' content='width=device-width,initial-scale=1'>"
                      f"<title>{html.escape(title)}</title><link rel='stylesheet' href='../../assets/site.css'>"
                      f"</head><body><header><a href='../../index.html'>&larr; Home</a></header>"
                      f"<main>{body}</main><footer>{ATTRIBUTION}</footer></body></html>")

          def build_full_pages(dicts, hottp, ffr):
              search = []
              for lang in ("hebrew", "greek"):
                  if lang not in dicts: continue
                  data = dicts[lang][0]
                  for e in (data if isinstance(data, list) else []):
                      eid = str(e.get("MainId") or e.get("Id") or "")
                      if not eid: continue
                      lemma = e.get("Lemma") or e.get("Word") or eid
                      senses = []
                      for bf in e.get("BaseForms") or []:
                          for lm in bf.get("LEXMeanings") or []:
                              for sense in lm.get("LEXSenses") or []:
                                  if sense.get("DefinitionShort"): senses.append(sense["DefinitionShort"])
                                  senses += sense.get("Glosses") or []
                      body = [f"<h1>{html.escape(str(lemma))}</h1>"]
                      if senses: body.append("<ul>" + "".join(f"<li>{html.escape(str(x))}</li>" for x in senses[:50]) + "</ul>")
                      rel = f"entries/{lang}/{slugify(eid)}.html"
                      write(os.path.join(OUT, rel), entry_page(str(lemma), "".join(body)))
                      search.append({"t": str(lemma), "u": rel, "k": lang})
              if hottp:
                  used = set()
                  for e in hottp:
                      eid = str(e.get("Id", ""))
                      body = [f"<h1>HOTTP {html.escape(eid)}</h1>"]
                      for k, v in e.items():
                          if isinstance(v, str) and v.strip() and k != "Id":
                              body.append(f"<h2>{html.escape(k)}</h2><p>{html.escape(v)}</p>")
                      rel = f"entries/hottp/{uniq_slug(used, eid)}.html"
                      write(os.path.join(OUT, rel), entry_page("HOTTP " + eid, "".join(body)))
                      search.append({"t": "HOTTP " + eid, "u": rel, "k": "hottp"})
              for kind, (src, _entries) in (ffr or {}).items():
                  used = set()
                  for el in ET.parse(src).getroot():
                      key = el.attrib.get("Key", ""); title = ""
                      for ch in el:
                          if localname(ch.tag) == "Title": title = (ch.text or "").strip(); break
                      rel = f"entries/{kind}/{uniq_slug(used, key)}.html"
                      write(os.path.join(OUT, rel), entry_page(title or key, f"<h1>{html.escape(title or key)}</h1>" + xml_to_html(el)))
                      search.append({"t": title or f"{kind} {key}", "u": rel, "k": kind})
              write_json(os.path.join(OUT, "search-index.json"), search)
              manifest["index"] = {"entries": len(search)}

          ASSETS_CSS = ("body{font-family:system-ui,sans-serif;max-width:52rem;margin:0 auto;padding:1rem;line-height:1.5}"
                        "header,footer{color:#555;font-size:.9rem}.card{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:.5rem 0}"
                        "input,select{padding:.5rem;width:100%;box-sizing:border-box;margin:.3rem 0}em{color:#444}span.sub{vertical-align:sub;font-size:.8em}")
          ASSETS_JS = ("async function runSearch(q){if(q.length<2)return;"
                       "const idx=await fetch('search-index.json').then(r=>r.json());"
                       "const hits=idx.filter(x=>x.t.toLowerCase().includes(q.toLowerCase())).slice(0,100);"
                       "document.getElementById('res').innerHTML=hits.map(h=>`<div class='card'><a href='${h.u}'>${h.t}</a></div>`).join('')||'No matches'}")

          def build_viewer():
              cards = "".join(f"<div class='card'><a href='{i['file']}'>{n}</a> <small>{i.get('entries','')} entries</small></div>"
                              for n, i in manifest["resources"].items() if "file" in i)
              route_links = "".join(f"<li><a href='{r['geojson']}'>{html.escape(r['title'])}</a></li>" for r in manifest["routes"][:500])
              search_js = ("<input placeholder='Search entries...' oninput=\"runSearch(this.value)\"><div id='res'></div>"
                           "<script src='assets/site.js'></script>") if FULL else ""
              dict_options = "".join(f"<option value='{i['file']}'>{n}</option>"
                                     for n, i in manifest["resources"].items() if i.get("file", "").startswith("data/") and i["file"].endswith(".json"))
              viewer = ""
              if not FULL and dict_options:
                  viewer = ("<h2>Dictionary lookup</h2>"
                            f"<select id='d'><option value=''>choose dictionary…</option>{dict_options}</select>"
                            "<input placeholder='search lemma or gloss' oninput='lookup(this.value)'><div id='res'></div>"
                            "<script>let DATA=null;async function lookup(q){const f=document.getElementById('d').value;"
                            "if(!f||q.length<2)return;if(!DATA){document.getElementById('res').textContent='loading…';"
                            "DATA=await fetch(f).then(r=>r.json())}const hits=(Array.isArray(DATA)?DATA:[])"
                            ".filter(e=>JSON.stringify(e).toLowerCase().includes(q.toLowerCase())).slice(0,50);"
                            "document.getElementById('res').innerHTML=hits.map(e=>`<div class='card'><b>${e.Lemma||e.Id}</b></div>`).join('')||'No matches'}</script>")
              write(os.path.join(OUT, "index.html"),
                    f"<!doctype html><html lang='en'><head><meta charset='utf-8'>"
                    f"<meta name='viewport' content='width=device-width,initial-scale=1'><title>UBS Open License Data</title>"
                    f"<link rel='stylesheet' href='assets/site.css'></head><body><h1>UBS Open License Data</h1><p>{ATTRIBUTION}</p>"
                    f"{search_js}{viewer}<h2>Resources</h2>{cards}"
                    f"<h2>Bible routes ({len(manifest['routes'])})</h2><ul>{route_links}</ul>"
                    f"<footer>Built from <code>{html.escape(UPSTREAM_SHA[:12])}</code>. {ATTRIBUTION}</footer></body></html>")

          NGINX = ("# nginx config snippet - set root to where you extracted this site.\n"
                   "types { application/json json; application/geo+json geojson; image/svg+xml svg svgz; application/xml xml; text/csv csv; }\n"
                   "gzip on; gzip_comp_level 6; gzip_min_length 1024;\n"
                   "gzip_types application/json application/geo+json application/xml image/svg+xml text/csv;\n"
                   "server { listen 80; location / { root /usr/share/nginx/html/site; try_files $uri $uri/ =404;"
                   " add_header Cache-Control \"public, max-age=604800\"; } }\n")

          def main():
              os.makedirs(OUT, exist_ok=True)
              copy_licenses()
              dicts = build_dictionaries(); hottp = build_hottp(); ffr = build_flora_fauna_realia()
              build_parallel(); build_images(); build_marble_index(); build_routes()
              if FULL: build_full_pages(dicts, hottp, ffr)
              write(os.path.join(OUT, "assets/site.css"), ASSETS_CSS)
              write(os.path.join(OUT, "assets/site.js"), ASSETS_JS)
              build_viewer()
              write(os.path.join(OUT, "nginx.conf.example"), NGINX)
              write(os.path.join(OUT, "README.md"), "# UBS open-license static site\n\nExtract anywhere, serve with nginx (see `nginx.conf.example`).\n\n" + ATTRIBUTION + "\n")
              write_json(os.path.join(OUT, "manifest.json"), manifest)
              print(f"Built '{SHAPE}' -> {OUT}")
              print(f"  resources: {len(manifest['resources'])}, routes: {len(manifest['routes'])}")
              if FULL: print(f"  index entries: {manifest.get('index', {}).get('entries')}")

          if __name__ == "__main__":
              main()
          PYEOF
      - name: Package
        run: zip -qr ubs-site.zip dist
      - name: Publish release asset (stable URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete site --yes --cleanup-tag 2>/dev/null || true
          gh release create site ubs-site.zip \
            --title "UBS static site (latest)" \
            --notes "Built from ${{ github.sha }} (${{ github.ref_name }})"