name: Build static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@main

      - name: Check out dictionary data
        uses: actions/checkout@main
        with:
          repository: ubsicap/ubs-open-license
          path: ubs-dict-site/data

      - name: Build static site
        run: python3 ubs-dict-site/build.py --repo ubs-dict-site/data --out ubs-dict-site/dist

      - name: Upload portable site archive
        uses: actions/upload-artifact@main
        with:
          name: ubs-dict-site
          path: ubs-dict-site/dist
          if-no-files-found: error
