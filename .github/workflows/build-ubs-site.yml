name: Build static site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@main

      - name: Check out dictionary data
        uses: actions/checkout@main
        with:
          repository: ubsicap/ubs-open-license
          path: data

      - name: Build static site
        run: python3 ubs-dict-site/build.py --repo data --out dist

      - name: Upload portable site archive
        uses: actions/upload-artifact@main
        with:
          name: ubs-dict-site
          path: dist
          if-no-files-found: error
