name: Build U-Boot for OrangePi R1

on:
  # Run manually from the Actions tab
  workflow_dispatch:
  # Also run automatically when you push changes to your patch files
  push:
    paths:
      - 'userpatches/**'

jobs:
  build:
    name: Compile U-Boot
    runs-on: ubuntu-latest

    steps:
      - name: Check out your repo
        uses: actions/checkout@v6

      - name: Clone Armbian build framework
        run: |
          git clone --depth=1 https://github.com/armbian/build armbian-build

      - name: Copy userpatches into Armbian build tree
        run: |
          mkdir -p armbian-build/userpatches/u-boot/u-boot-sunxi-current
          cp userpatches/*.patch \
             armbian-build/userpatches/u-boot/u-boot-sunxi-current/

      - name: Compile U-Boot
        run: |
          cd armbian-build
          ./compile.sh uboot \
            BOARD="orangepi-r1" \
            BRANCH="current" \
            RELEASE="trixie" \
            BUILD_MINIMAL="yes" \
            BUILD_DESKTOP="no" \
            KERNEL_CONFIGURE="no" \
            COMPRESS_OUTPUTIMAGE="no"

      - name: List output directory (debug)
        if: always()
        run: |
          echo "=== Contents of armbian-build/output/debs/ ==="
          find armbian-build/output/debs/ -type f 2>/dev/null || echo "Directory not found or empty"

      - name: Upload compiled U-Boot as artifact
        uses: actions/upload-artifact@v7
        with:
          name: u-boot-orangepi-r1
          path: armbian-build/output/debs/linux-u-boot-current-orangepi-r1_*.deb
          retention-days: 7
