name: Armbian Trixie for S812 with custom dts

on:
  workflow_dispatch:

env:
  ARMBIAN_REPO:   https://github.com/SLAzurin/build-armbian-custom.git
  ARMBIAN_BRANCH: s8xx-2025-02-27
  KERNEL_REPO:    https://github.com/xdarklight/linux.git
  KERNEL_BRANCH:  meson-mx-integration-6.20-20251223
  REPO_DTS_DIR:   config_files/m8s

jobs:
  build:
    name: Build image
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout this repo
      uses: actions/checkout@v6
      with:
        path: my-repo

    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git build-essential bc bison flex libssl-dev \
          gcc-arm-linux-gnueabihf \
          u-boot-tools device-tree-compiler \
          qemu-user-static \
          debootstrap \
          debian-archive-keyring \
          xz-utils \
          parted \
          rsync \
          kmod \
          cpio \
          ccache \
          python3

    - name: Update Debian archive keyring (host)
      run: |
        wget -q -O /tmp/keyring.deb \
          https://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
        sudo dpkg -i /tmp/keyring.deb
        rm /tmp/keyring.deb
        sudo apt-get update -qq

    - name: Resolve remote HEAD SHAs for cache keys
      id: shas
      run: |
        ARMBIAN_SHA=$(git ls-remote "${{ env.ARMBIAN_REPO }}" \
          "refs/heads/${{ env.ARMBIAN_BRANCH }}" | cut -f1)
        KERNEL_SHA=$(git ls-remote "${{ env.KERNEL_REPO }}" \
          "refs/heads/${{ env.KERNEL_BRANCH }}" | cut -f1)

        echo "armbian_sha=${ARMBIAN_SHA}" >> "$GITHUB_OUTPUT"
        echo "kernel_sha=${KERNEL_SHA}"   >> "$GITHUB_OUTPUT"
        echo "Armbian branch HEAD: ${ARMBIAN_SHA}"
        echo "Kernel  branch HEAD: ${KERNEL_SHA}"

    - name: Clone SLAzurin Armbian build fork
      run: |
        git clone --depth=1 \
          --branch "${{ env.ARMBIAN_BRANCH }}" \
          "${{ env.ARMBIAN_REPO }}" \
          armbian-build
        cd armbian-build
        mv userpatches.s8xx userpatches

    - name: Cache Armbian rootfs
      uses: actions/cache@v4
      with:
        path: armbian-build/cache/rootfs
        key: armbian-rootfs-${{ steps.shas.outputs.armbian_sha }}-trixie
        restore-keys: |
          armbian-rootfs-${{ steps.shas.outputs.armbian_sha }}-
          armbian-rootfs-

    - name: Cache Armbian apt packages
      uses: actions/cache@v4
      with:
        path: armbian-build/cache/aptcache
        key: armbian-aptcache-trixie-${{ steps.shas.outputs.armbian_sha }}
        restore-keys: |
          armbian-aptcache-trixie-
          armbian-aptcache-

    - name: Fix cache directory permissions
      run: |
        sudo mkdir -p armbian-build/cache/rootfs armbian-build/cache/aptcache
        sudo chown -R root:root armbian-build/cache/

    - name: Remove foreign x86-64 binary from BSP source
      run: |
        cd armbian-build
        find packages/bsp/ -name 'ld-linux-x86-64.so.2' -delete
        if find packages/bsp/ -name 'ld-linux-x86-64.so.2' | grep -q .; then
          echo "ERROR: x86-64 file still present in BSP source"
          exit 1
        fi
        echo "BSP source cleaned."

    - name: Patch aml-s812.conf family_tweaks for minimal Trixie build
      run: |
        python3 - << 'PYEOF'
        import sys, shutil, pathlib

        target = pathlib.Path("armbian-build/config/sources/families/aml-s812.conf")
        shutil.copy(target, str(target) + ".bak")
        text = target.read_text()
        applied = 0

        old1 = "\tcp $SRC/packages/bsp/mpv/mpv_mainline.conf $SDCARD/etc/mpv/mpv.conf"
        new1 = "\t[ -d \"$SDCARD/etc/mpv\" ] && cp $SRC/packages/bsp/mpv/mpv_mainline.conf $SDCARD/etc/mpv/mpv.conf || true"
        if old1 in text:
            text = text.replace(old1, new1)
            print("Fix 1 applied: mpv copy guarded")
            applied += 1
        else:
            print("WARNING Fix 1: mpv line not found (already patched?)")

        old2 = ">> $SDCARD/etc/X11/xorg.conf.d/01-armbian-defaults.conf"
        new2 = ">> $SDCARD/etc/X11/xorg.conf.d/01-armbian-defaults.conf || true"
        old2b = "\techo 'Section \"Device\"'"
        new2b = "\t[ -d \"$SDCARD/etc/X11\" ] && echo 'Section \"Device\"'"
        if old2 in text and old2b in text:
            text = text.replace(old2b, new2b)
            text = text.replace(old2, new2)
            print("Fix 2 applied: xorg block guarded")
            applied += 1
        else:
            print("WARNING Fix 2: xorg lines not found (already patched?)")

        old3 = "\tmkimage -A arm -O linux -C none -T kernel -a 0x00208000 -e 0x00208000 -n linux-next -d $SDCARD/boot/zImage $SDCARD/boot/uImage"
        new3 = "\t# uImage from zImage skipped: real uImage installed from xdarklight kernel build"
        if old3 in text:
            text = text.replace(old3, new3)
            print("Fix 3 applied: mkimage zImage removed")
            applied += 1
        else:
            print("WARNING Fix 3: mkimage zImage line not found (already patched?)")

        target.write_text(text)
        print(f"aml-s812.conf: {applied}/3 patches applied.")
        if applied < 3:
            print("Some patches were not applied — check warnings above.")
            print("The upstream file may have changed. Build may still succeed if")
            print("the lines were already patched in a previous cache-hit run.")
        PYEOF

    - name: Patch rootfs-create.sh for SHA-1 acceptance (inside chroot)
      run: |
        python3 - << 'PYEOF'
        import sys, shutil, pathlib
        
        target = pathlib.Path("armbian-build/lib/functions/rootfs/rootfs-create.sh")
        shutil.copy(target, str(target) + ".bak")
        text = target.read_text()
        
        marker = 'display_alert "Updating package list"'
        if 'apt-sequoia.config' in text:
            print("Patch already applied, skipping.")
            sys.exit(0)
        if marker not in text:
            print(f"WARNING: marker not found in {target}")
            print("File may have changed upstream — skipping patch.")
            sys.exit(0)
        
        inject = """
        \t# Workaround: extend SHA-1 acceptance for Armbian repos signed with SHA-1
        \tmkdir -p "${SDCARD}/etc/crypto-policies/back-ends"
        \tcat > "${SDCARD}/etc/crypto-policies/back-ends/apt-sequoia.config" << 'EOFCONF'
        [hash_algorithms]
        sha1.second_preimage_resistance = 2030-01-01
        sha1.collision_resistance = 2030-01-01
        EOFCONF
        """
        
        text = text.replace(marker, inject + "\t" + marker)
        target.write_text(text)
        print("rootfs-create.sh patched successfully.")
        PYEOF

    - name: Build Armbian base image
      run: |
        cd armbian-build
        sudo COLUMNS=160 \
          GITHUB_ACTIONS=true \
          GITHUB_OUTPUT="$GITHUB_OUTPUT" \
          ./compile.sh \
            BOARD=aml-s812 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=no \
            USE_TORRENT=no \
            KERNEL_GIT=shallow

    - name: Upload Armbian build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: armbian-build-logs-${{ github.run_number }}
        path: armbian-build/output/logs/
        retention-days: 7
        if-no-files-found: ignore

    - name: Cache kernel source tree
      id: kernel-src-cache
      uses: actions/cache@v4
      with:
        path: linux-src
        key: kernel-src-${{ steps.shas.outputs.kernel_sha }}

    - name: Clone xdarklight kernel (skipped on cache hit)
      if: steps.kernel-src-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 \
          --branch "${{ env.KERNEL_BRANCH }}" \
          "${{ env.KERNEL_REPO }}" \
          linux-src

    - name: Inject custom DTS files into kernel source
      run: |
        KERNEL_DTS_DIR="linux-src/arch/arm/boot/dts/amlogic"
        REPO_DTS="my-repo/${{ env.REPO_DTS_DIR }}"

        echo "=== DTS files in your repo ==="
        ls -lh "$REPO_DTS/" || echo "(directory not found — check REPO_DTS_DIR)"

        for f in meson8m2-m8s.dts; do
          if [ -f "$REPO_DTS/$f" ]; then
            echo "Injecting $f ..."
            cp "$REPO_DTS/$f" "$KERNEL_DTS_DIR/$f"
          else
            echo "Skipping $f (not in your repo, using upstream)"
          fi
        done

        echo "=== Verifying nfc status in injected DTS ==="
        grep -A3 "^&nfc" "$KERNEL_DTS_DIR/meson8m2-m8s.dts" || \
          echo "WARNING: &nfc block not found — check your DTS file"

    - name: Cache kernel ccache objects
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: kernel-ccache-${{ steps.shas.outputs.kernel_sha }}
        restore-keys: |
          kernel-ccache-

    - name: Configure ccache
      run: |
        ccache --max-size=5G
        ccache --zero-stats
        echo "CC=ccache arm-linux-gnueabihf-gcc"  >> "$GITHUB_ENV"
        echo "CXX=ccache arm-linux-gnueabihf-g++" >> "$GITHUB_ENV"

    - name: Seed kernel config
      run: |
        cp my-repo/config_files/config-aml-s812 linux-src/.config
        cd linux-src

        # Existing patch
        sed -i \
          's@# CONFIG_POSIX_MQUEUE is not set@CONFIG_POSIX_MQUEUE=y\nCONFIG_POSIX_MQUEUE_SYSCTL=y@g' \
          .config

        # -----------------------------------------------------------------
        # NEW: Enable NAND / MTD / UBI support so the kernel can see and
        # mount the NAND flash on the M8S board.
        #
        # We use sed to either flip "is not set" lines or append if missing,
        # then let olddefconfig resolve any remaining dependencies cleanly.
        # -----------------------------------------------------------------
        patch_kconfig() {
          local key="$1"
          local val="$2"          # y or m
          if grep -q "^# ${key} is not set" .config; then
            sed -i "s@^# ${key} is not set@${key}=${val}@g" .config
            echo "  enabled: ${key}=${val}"
          elif grep -q "^${key}=" .config; then
            sed -i "s@^${key}=.*@${key}=${val}@g" .config
            echo "  updated: ${key}=${val}"
          else
            echo "${key}=${val}" >> .config
            echo "  appended: ${key}=${val}"
          fi
        }

        echo "--- Patching NAND/MTD/UBI kernel config options ---"

        # Core MTD subsystem
        patch_kconfig CONFIG_MTD                    y
        patch_kconfig CONFIG_MTD_BLOCK              y   # /dev/mtdblockN access
        patch_kconfig CONFIG_MTD_CHAR               y   # /dev/mtdN  access

        # NAND core and Amlogic driver
        patch_kconfig CONFIG_MTD_NAND_CORE          y
        patch_kconfig CONFIG_MTD_NAND_ECC_SW_HAMMING y
        patch_kconfig CONFIG_MTD_NAND_MESON         y   # amlogic,meson8-nfc driver

        # UBI layer — needed to mount UBIFS rootfs on NAND
        patch_kconfig CONFIG_MTD_UBI                y
        patch_kconfig CONFIG_MTD_UBI_WL_THRESHOLD   4096
        patch_kconfig CONFIG_MTD_UBI_BEB_LIMIT      20
        patch_kconfig CONFIG_UBIFS_FS               y

        # Optional but useful: expose MTD partitions via cmdline / OF
        patch_kconfig CONFIG_MTD_OF_PARTS           y
        patch_kconfig CONFIG_MTD_CMDLINE_PARTS      y

        echo "--- Running olddefconfig to resolve dependencies ---"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

        echo "--- Verifying key options are set ---"
        for key in CONFIG_MTD CONFIG_MTD_NAND_CORE CONFIG_MTD_NAND_MESON \
                   CONFIG_MTD_UBI CONFIG_UBIFS_FS; do
          val=$(grep "^${key}=" .config || echo "NOT SET")
          echo "  ${key}: ${val}"
        done

    - name: Build kernel uImage, DTB, and modules
      run: |
        cd linux-src
        # Build uImage + all DTBs + modules in one pass
        make -j$(nproc) \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          CC="$CC" \
          CXX="$CXX" \
          LOCALVERSION="-aml-s812" \
          LOADADDR=0x00208000 \
          uImage dtbs modules

        echo "=== Verifying meson8m2-m8s.dtb was built ==="
        ls -lh arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb || \
          echo "ERROR: DTB not found — check DTS compilation"

    - name: Show ccache statistics
      run: ccache --show-stats

    - name: Install kernel, DTB, and modules into image
      run: |
        IMAGE=$(ls armbian-build/output/images/*.img | head -1)
        echo "Target image: $IMAGE"
        mkdir -p /tmp/mnt_boot /tmp/mnt_root

        LOOP=$(sudo losetup --find --show --partscan "$IMAGE")
        echo "Loop device: $LOOP"

        sudo mount "${LOOP}p1" /tmp/mnt_boot
        sudo mount "${LOOP}p2" /tmp/mnt_root

        # Back up old uImage if present
        [ -f /tmp/mnt_boot/uImage ] && \
          sudo cp /tmp/mnt_boot/uImage /tmp/mnt_boot/uImage.bak

        # Install uImage
        sudo cp linux-src/arch/arm/boot/uImage /tmp/mnt_boot/uImage

        # -----------------------------------------------------------------
        # NEW: Install the compiled DTB into the boot partition.
        # The stock U-Boot on M8S loads the DTB from the boot partition;
        # without this the board would use a stale/wrong DTB and the NAND
        # controller would not be seen.
        # -----------------------------------------------------------------
        sudo cp \
          linux-src/arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb \
          /tmp/mnt_boot/meson8m2-m8s.dtb
        echo "DTB installed: meson8m2-m8s.dtb"

        # Install kernel modules
        sudo make -C linux-src \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          INSTALL_MOD_PATH=/tmp/mnt_root \
          modules_install

        # Save finalised .config to /boot — useful as a base for future builds
        sudo cp linux-src/.config /tmp/mnt_boot/config-6.20.0-aml-s812

        # Fix root partition label in boot config files
        for cfg in uEnv.txt boot.ini; do
          if sudo test -f "/tmp/mnt_boot/$cfg"; then
            sudo sed -i 's|root=LABEL=ROOTFS|root=LABEL=armbi_root|g' \
              "/tmp/mnt_boot/$cfg"
            echo "$cfg root label fixed."
          fi
        done
        if sudo test -f /tmp/mnt_boot/armbianEnv.txt; then
          sudo sed -i \
            's|rootdev=LABEL=ROOTFS|rootdev=LABEL=armbi_root|g' \
            /tmp/mnt_boot/armbianEnv.txt
          echo "armbianEnv.txt rootdev fixed."
        fi

        # Verify root partition label
        ROOT_LABEL=$(sudo e2label "${LOOP}p2" 2>/dev/null || echo "unknown")
        echo "Root partition (${LOOP}p2) label: ${ROOT_LABEL}"
        if [ "$ROOT_LABEL" != "armbi_root" ] && [ "$ROOT_LABEL" != "ROOTFS" ]; then
          echo "WARNING: unexpected root label '${ROOT_LABEL}' — setting it to armbi_root"
          sudo e2label "${LOOP}p2" armbi_root
        fi

        # -----------------------------------------------------------------
        # NEW: Install mtd-utils into the rootfs so you have the tools to
        # flash NAND (flash_erase, nandwrite, ubiformat, nanddump) when you
        # boot this image from SD/USB.
        # -----------------------------------------------------------------
        echo "Installing mtd-utils into rootfs via chroot ..."
        sudo chroot /tmp/mnt_root /bin/bash -c "
          apt-get update -qq && \
          apt-get install -y --no-install-recommends mtd-utils && \
          apt-get clean
        " || echo "WARNING: mtd-utils install failed — install manually after boot"

        # -----------------------------------------------------------------
        # NEW: Drop a NAND flash helper script into /root/ on the image.
        # After booting from SD/USB, run:  sudo bash /root/flash-to-nand.sh
        # It will walk you through erasing and writing u-boot, kernel, and
        # rootfs to the correct NAND partitions based on the printenv layout.
        # -----------------------------------------------------------------
        sudo tee /tmp/mnt_root/root/flash-to-nand.sh > /dev/null << 'FLASHSCRIPT'
        #!/usr/bin/env bash
        # =============================================================================
        # flash-to-nand.sh  —  Flash u-boot, kernel, and rootfs to M8S NAND
        #
        # Run this script after booting the Armbian image from SD/USB.
        # Make sure the files you want to flash are accessible (e.g. on a USB stick
        # mounted at /mnt/usb or copied to /root/).
        #
        # NAND partition layout from U-Boot printenv:
        #   mtd0  0x0000000  +0x100000   u-boot          (1 MiB)
        #   mtd1  0x0400000  +0x010000   u-boot-env      (64 KiB)  [DO NOT TOUCH]
        #   mtd2  0x1000000  +0x400000   boot / kernel   (4 MiB)
        #   mtd3  0x1400000  +0x8000000  system / rootfs (128 MiB)
        # =============================================================================
        
        set -e
        
        RED='\033[0;31m'; YEL='\033[1;33m'; GRN='\033[0;32m'; NC='\033[0m'
        
        info()  { echo -e "${GRN}[INFO]${NC}  $*"; }
        warn()  { echo -e "${YEL}[WARN]${NC}  $*"; }
        error() { echo -e "${RED}[ERROR]${NC} $*"; exit 1; }
        
        # ---------- sanity checks ----------
        [ "$(id -u)" -eq 0 ] || error "Run as root:  sudo bash $0"
        command -v flash_erase  >/dev/null || error "flash_erase not found. Run: apt install mtd-utils"
        command -v nandwrite    >/dev/null || error "nandwrite not found. Run:  apt install mtd-utils"
        command -v ubiformat    >/dev/null || error "ubiformat not found. Run:  apt install mtd-utils"
        
        # ---------- check MTD devices exist ----------
        info "Detected MTD devices:"
        cat /proc/mtd || error "/proc/mtd not found — is the NAND driver loaded? Check dmesg."
        echo
        
        # ---------- helper: confirm before destructive action ----------
        confirm() {
          read -r -p "$1 [y/N] " ans
          [[ "$ans" =~ ^[Yy]$ ]] || { warn "Skipped."; return 1; }
        }
        
        # =============================================================================
        # 1. Flash U-Boot  (mtd0 — DANGEROUS: bad write = no boot)
        # =============================================================================
        warn "=========================================================="
        warn " Flashing U-Boot is DANGEROUS."
        warn " If you write a bad image the board will NOT boot at all."
        warn " Skip this unless you have a USB Amlogic burn-mode cable"
        warn " for recovery, or you are confident in your image."
        warn "=========================================================="
        echo
        if confirm "Do you want to flash U-Boot to /dev/mtd0?"; then
          read -r -p "Path to u-boot binary: " UBOOT_BIN
          [ -f "$UBOOT_BIN" ] || error "File not found: $UBOOT_BIN"
          info "Erasing /dev/mtd0 ..."
          flash_erase /dev/mtd0 0 0
          info "Writing $UBOOT_BIN to /dev/mtd0 ..."
          nandwrite -p /dev/mtd0 "$UBOOT_BIN"
          info "U-Boot flashed successfully."
        fi
        
        # =============================================================================
        # 2. Flash Kernel (uImage)  →  mtd2 = boot partition
        # =============================================================================
        echo
        if confirm "Flash kernel (uImage) to /dev/mtd2 (boot partition)?"; then
          read -r -p "Path to uImage: " UIMAGE
          [ -f "$UIMAGE" ] || error "File not found: $UIMAGE"
          info "Erasing /dev/mtd2 ..."
          flash_erase /dev/mtd2 0 0
          info "Writing $UIMAGE to /dev/mtd2 ..."
          nandwrite -p /dev/mtd2 "$UIMAGE"
          info "Kernel flashed successfully."
        fi
        
        # =============================================================================
        # 3. Flash rootfs  →  mtd3 = system partition  (UBIFS)
        # =============================================================================
        echo
        warn "Rootfs must be a pre-built UBI image (.ubi)."
        warn "Build one with:  ubinize -o rootfs.ubi -m 2048 -p 256KiB ubinize.cfg"
        echo
        if confirm "Flash rootfs (.ubi image) to /dev/mtd3 (system partition)?"; then
          read -r -p "Path to rootfs.ubi: " ROOTFS_UBI
          [ -f "$ROOTFS_UBI" ] || error "File not found: $ROOTFS_UBI"
          info "Erasing /dev/mtd3 ..."
          flash_erase /dev/mtd3 0 0
          info "Running ubiformat on /dev/mtd3 ..."
          ubiformat /dev/mtd3 -f "$ROOTFS_UBI"
          info "Rootfs flashed successfully."
        fi
        
        # =============================================================================
        # 4. Set U-Boot environment for NAND boot
        # =============================================================================
        echo
        info "=========================================================="
        info " After flashing, set U-Boot boot args via serial console:"
        info ""
        info "   setenv bootargs 'root=ubi0:rootfs rootfstype=ubifs"
        info "       ubi.mtd=3 console=ttyAML0,115200 rw'"
        info "   setenv bootcmd 'nand read 0x1000000 0x1000000 0x400000; bootm 0x1000000'"
        info "   saveenv"
        info "   reset"
        info "=========================================================="
        
        info "All done. Check dmesg for any errors."
        FLASHSCRIPT

        sudo chmod +x /tmp/mnt_root/root/flash-to-nand.sh
        echo "flash-to-nand.sh installed to /root/flash-to-nand.sh"

        sudo umount /tmp/mnt_boot
        sudo umount /tmp/mnt_root
        sudo losetup -d "$LOOP"
        echo "Kernel + DTB + modules installed successfully."

    - name: Compress image with xz
      run: |
        IMAGE=$(ls armbian-build/output/images/*.img | head -1)
        sudo xz -T0 -v "$IMAGE"
        ls -lh armbian-build/output/images/

    - name: Upload image as artifact
      uses: actions/upload-artifact@v7
      with:
        name: armbian-trixie-linux620-m8s-build${{ github.run_number }}
        path: armbian-build/output/images/*.xz
        retention-days: 7
        if-no-files-found: error
