name: Build Armbian Trixie with Kernel S812

on:
  workflow_dispatch:
    inputs:
      skip_armbian:
        description: 'Skip Armbian build (kernel/DTS changes only)'
        type: boolean
        default: false

env:
  ARMBIAN_REPO:   https://github.com/SLAzurin/build-armbian-custom.git
  ARMBIAN_BRANCH: s8xx-2025-02-27
  KERNEL_REPO:    https://github.com/xdarklight/linux.git
  KERNEL_BRANCH:  meson-mx-integration-6.20-20251223
  REPO_DTS_DIR:   config_files/m8s

jobs:
  build:
    name: Build image
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout this repo
      uses: actions/checkout@v6
      with:
        path: my-repo

    - name: Free disk space
      run: |
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        df -h
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git build-essential bc bison flex libssl-dev \
          gcc-arm-linux-gnueabihf \
          u-boot-tools device-tree-compiler \
          qemu-user-static \
          debootstrap \
          debian-archive-keyring \
          xz-utils \
          parted \
          rsync \
          kmod \
          cpio \
          ccache \
          python3
    - name: Update Debian archive keyring (host)
      run: |
        wget -q -O /tmp/keyring.deb \
          https://ftp.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
        sudo dpkg -i /tmp/keyring.deb
        rm /tmp/keyring.deb
        sudo apt-get update -qq
    - name: Resolve remote HEAD SHAs for cache keys
      id: shas
      run: |
        ARMBIAN_SHA=$(git ls-remote "${{ env.ARMBIAN_REPO }}" \
          "refs/heads/${{ env.ARMBIAN_BRANCH }}" | cut -f1)
        KERNEL_SHA=$(git ls-remote "${{ env.KERNEL_REPO }}" \
          "refs/heads/${{ env.KERNEL_BRANCH }}" | cut -f1)
        echo "armbian_sha=${ARMBIAN_SHA}" >> "$GITHUB_OUTPUT"
        echo "kernel_sha=${KERNEL_SHA}"   >> "$GITHUB_OUTPUT"
        echo "Armbian branch HEAD: ${ARMBIAN_SHA}"
        echo "Kernel  branch HEAD: ${KERNEL_SHA}"
    - name: Clone SLAzurin Armbian build fork
      run: |
        git clone --depth=1 \
          --branch "${{ env.ARMBIAN_BRANCH }}" \
          "${{ env.ARMBIAN_REPO }}" \
          armbian-build
        cd armbian-build
        mv userpatches.s8xx userpatches
    - name: Cache Armbian rootfs
      uses: actions/cache@v5
      with:
        path: armbian-build/cache/rootfs
        key: armbian-rootfs-${{ steps.shas.outputs.armbian_sha }}-trixie
        restore-keys: |
          armbian-rootfs-${{ steps.shas.outputs.armbian_sha }}-
          armbian-rootfs-
    - name: Cache Armbian apt packages
      uses: actions/cache@v5
      with:
        path: armbian-build/cache/aptcache
        key: armbian-aptcache-trixie-${{ steps.shas.outputs.armbian_sha }}
        restore-keys: |
          armbian-aptcache-trixie-
          armbian-aptcache-
    - name: Fix cache directory permissions
      run: |
        sudo mkdir -p armbian-build/cache/rootfs armbian-build/cache/aptcache
        sudo chown -R root:root armbian-build/cache/
    - name: Remove foreign x86-64 binary from BSP source
      run: |
        cd armbian-build
        find packages/bsp/ -name 'ld-linux-x86-64.so.2' -delete
        if find packages/bsp/ -name 'ld-linux-x86-64.so.2' | grep -q .; then
          echo "ERROR: x86-64 file still present in BSP source"
          exit 1
        fi
        echo "BSP source cleaned."
    - name: Patch aml-s812.conf family_tweaks for minimal Trixie build
      run: |
        python3 - << 'PYEOF'
        import sys, shutil, pathlib
        target = pathlib.Path("armbian-build/config/sources/families/aml-s812.conf")
        shutil.copy(target, str(target) + ".bak")
        text = target.read_text()
        applied = 0
        old1 = "\tcp $SRC/packages/bsp/mpv/mpv_mainline.conf $SDCARD/etc/mpv/mpv.conf"
        new1 = "\t[ -d \"$SDCARD/etc/mpv\" ] && cp $SRC/packages/bsp/mpv/mpv_mainline.conf $SDCARD/etc/mpv/mpv.conf || true"
        if old1 in text:
            text = text.replace(old1, new1)
            print("Fix 1 applied: mpv copy guarded")
            applied += 1
        else:
            print("WARNING Fix 1: mpv line not found (already patched?)")
        old2 = ">> $SDCARD/etc/X11/xorg.conf.d/01-armbian-defaults.conf"
        new2 = ">> $SDCARD/etc/X11/xorg.conf.d/01-armbian-defaults.conf || true"
        old2b = "\techo 'Section \"Device\"'"
        new2b = "\t[ -d \"$SDCARD/etc/X11\" ] && echo 'Section \"Device\"'"
        if old2 in text and old2b in text:
            text = text.replace(old2b, new2b)
            text = text.replace(old2, new2)
            print("Fix 2 applied: xorg block guarded")
            applied += 1
        else:
            print("WARNING Fix 2: xorg lines not found (already patched?)")
        old3 = "\tmkimage -A arm -O linux -C none -T kernel -a 0x00208000 -e 0x00208000 -n linux-next -d $SDCARD/boot/zImage $SDCARD/boot/uImage"
        new3 = "\t# uImage from zImage skipped: real uImage installed from xdarklight kernel build"
        if old3 in text:
            text = text.replace(old3, new3)
            print("Fix 3 applied: mkimage zImage removed")
            applied += 1
        else:
            print("WARNING Fix 3: mkimage zImage line not found (already patched?)")
        target.write_text(text)
        print(f"aml-s812.conf: {applied}/3 patches applied.")
        if applied < 3:
            print("Some patches were not applied — check warnings above.")
            print("The upstream file may have changed. Build may still succeed if")
            print("the lines were already patched in a previous cache-hit run.")
        PYEOF
    - name: Patch rootfs-create.sh for SHA-1 acceptance (inside chroot)
      run: |
        python3 - << 'PYEOF'
        import sys, shutil, pathlib
        
        target = pathlib.Path("armbian-build/lib/functions/rootfs/rootfs-create.sh")
        shutil.copy(target, str(target) + ".bak")
        text = target.read_text()
        
        marker = 'display_alert "Updating package list"'
        if 'apt-sequoia.config' in text:
            print("Patch already applied, skipping.")
            sys.exit(0)
        if marker not in text:
            print(f"WARNING: marker not found in {target}")
            print("File may have changed upstream — skipping patch.")
            sys.exit(0)
        
        inject = """
        \t# Workaround: extend SHA-1 acceptance for Armbian repos signed with SHA-1
        \tmkdir -p "${SDCARD}/etc/crypto-policies/back-ends"
        \tcat > "${SDCARD}/etc/crypto-policies/back-ends/apt-sequoia.config" << 'EOFCONF'
        [hash_algorithms]
        sha1.second_preimage_resistance = 2030-01-01
        sha1.collision_resistance = 2030-01-01
        EOFCONF
        """
        
        text = text.replace(marker, inject + "\t" + marker)
        target.write_text(text)
        print("rootfs-create.sh patched successfully.")
        PYEOF
    - name: Build Armbian base image
      if: ${{ inputs.skip_armbian != true }}
      run: |
        cd armbian-build
        sudo COLUMNS=160 \
          GITHUB_ACTIONS=true \
          GITHUB_OUTPUT="$GITHUB_OUTPUT" \
          ./compile.sh \
            BOARD=aml-s812 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=no \
            USE_TORRENT=no \
            KERNEL_GIT=shallow
    - name: Upload Armbian build logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: armbian-build-logs-${{ github.run_number }}
        path: armbian-build/output/logs/
        retention-days: 7
        if-no-files-found: ignore

    - name: Cache kernel source tree
      id: kernel-src-cache
      uses: actions/cache@v5
      with:
        path: linux-src
        key: kernel-src-${{ steps.shas.outputs.kernel_sha }}

    - name: Clone xdarklight kernel (skipped on cache hit)
      if: steps.kernel-src-cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth=1 \
          --branch "${{ env.KERNEL_BRANCH }}" \
          "${{ env.KERNEL_REPO }}" \
          linux-src
    - name: Inject custom DTS files into kernel source
      run: |
        KERNEL_DTS_DIR="linux-src/arch/arm/boot/dts/amlogic"
        REPO_DTS="my-repo/${{ env.REPO_DTS_DIR }}"
        echo "=== DTS files found in your repo ==="
        ls -lh "$REPO_DTS/" 2>/dev/null || {
          echo "ERROR: Directory '$REPO_DTS' not found."
          echo "Check that REPO_DTS_DIR='${{ env.REPO_DTS_DIR }}' matches your repo layout."
          exit 1
        }
        # Inject each file if it exists in your repo
        for f in meson8m2-m8s.dts meson8m2.dtsi meson8.dtsi; do
          if [ -f "$REPO_DTS/$f" ]; then
            cp "$REPO_DTS/$f" "$KERNEL_DTS_DIR/$f"
            echo "Injected: $f"
          else
            echo "Skipped (not in repo, using upstream): $f"
          fi
        done
        echo ""
        echo "=== Verifying &nfc status in injected DTS ==="
        if grep -A5 "^&nfc" "$KERNEL_DTS_DIR/meson8m2-m8s.dts" | grep -q "status.*okay"; then
          echo "OK: &nfc { status = okay } found"
        else
          echo "WARNING: &nfc status = okay NOT found — NAND will not be recognized!"
          echo "--- Current &nfc block ---"
          grep -A5 "^&nfc" "$KERNEL_DTS_DIR/meson8m2-m8s.dts" || true
        fi
        echo ""
        echo "=== Verifying partition table in injected DTS ==="
        grep -E "label|reg = " "$KERNEL_DTS_DIR/meson8m2-m8s.dts" | grep -A1 "label" || true
    - name: Patch meson_nand driver for Meson8 support and large-page NAND
      run: |
        DRIVER="linux-src/drivers/mtd/nand/raw/meson_nand.c"

        echo "=== Checking driver exists ==="
        [ -f "$DRIVER" ] || { echo "ERROR: $DRIVER not found"; exit 1; }

        python3 - << 'PYEOF'
        import pathlib, sys, re
        
        target = pathlib.Path("linux-src/drivers/mtd/nand/raw/meson_nand.c")
        text = target.read_text()
        applied = 0
        
        # ------------------------------------------------------------------
        # Fix 1: Add "amlogic,meson8-nfc" to the compatible ID table.
        # Use regex so whitespace differences don't matter.
        # ------------------------------------------------------------------
        pattern1 = re.compile(
            r'(static const struct of_device_id meson_nfc_id_table\[\] = \{)',
            re.MULTILINE
        )
        
        insert = (
            '\t{\n'
            '\t\t.compatible = "amlogic,meson8-nfc",\n'
            '\t\t.data = &meson_gxl_data,\n'
            '\t}, '
        )
        
        if 'amlogic,meson8-nfc' in text:
            print("Fix 1 skipped: amlogic,meson8-nfc already present")
            applied += 1
        elif pattern1.search(text):
            text = pattern1.sub(r'\1\n' + insert, text)
            print("Fix 1 applied: amlogic,meson8-nfc added to ID table")
            applied += 1
        else:
            print("ERROR: Fix 1 failed — meson_nfc_id_table not found")
            sys.exit(1)
        
        # ------------------------------------------------------------------
        # Fix 2: Downgrade raw mode size check from hard error to warning.
        # Use regex to match regardless of exact whitespace/format.
        # ------------------------------------------------------------------
        pattern2 = re.compile(
            r'(raw_writesize = mtd->writesize \+ mtd->oobsize;\s*\n)'
            r'\s*if \(raw_writesize > NFC_CMD_RAW_LEN\) \{\s*\n'
            r'\s*dev_err\([^;]+;\s*\n'
            r'\s*return -EINVAL;\s*\n'
            r'\s*\}',
            re.MULTILINE
        )
        
        new2 = (
            '\traw_writesize = mtd->writesize + mtd->oobsize;\n'
            '\tif (raw_writesize > NFC_CMD_RAW_LEN) {\n'
            '\t\t/*\n'
            '\t\t * Large-page chip (e.g. SanDisk SDTNRGAMA page=16384 +\n'
            '\t\t * oob=1280 = 17664) exceeds the 14-bit NFC DMA length\n'
            '\t\t * register limit (0x3FFF = 16383). Raw mode is not\n'
            '\t\t * supported but ECC mode (1024-byte steps) works fine.\n'
            '\t\t */\n'
            '\t\tdev_warn(nfc->dev,\n'
            '\t\t\t "raw mode unsupported for this chip (%d > %ld); ECC mode only\\\\n",\n'
            '\t\t\t raw_writesize, NFC_CMD_RAW_LEN);\n'
            '\t}'
        )
        
        if 'ECC mode only' in text:
            print("Fix 2 skipped: raw mode patch already applied")
            applied += 1
        elif pattern2.search(text):
            text = pattern2.sub(new2, text)
            print("Fix 2 applied: raw mode check downgraded to warning")
            applied += 1
        else:
            print("ERROR: Fix 2 failed — raw_writesize block not found")
            print("Fragments found:")
            for line in text.split('\n'):
                if 'raw_writesize' in line or 'too big' in line:
                    print(f"  {repr(line)}")
            sys.exit(1)
        
        target.write_text(text)
        print(f"\nTotal: {applied}/2 patches applied.")
        PYEOF

        echo "=== Verifying Fix 1: ID table ==="
        grep -A14 "meson_nfc_id_table\[\]" "$DRIVER" | head -16

        echo "=== Verifying Fix 2: raw_writesize block ==="
        grep -A12 "raw_writesize = " "$DRIVER"

    - name: Cache kernel ccache objects
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: kernel-ccache-${{ steps.shas.outputs.kernel_sha }}
        restore-keys: |
          kernel-ccache-
    - name: Configure ccache
      run: |
        ccache --max-size=5G
        ccache --zero-stats
        echo "CC=ccache arm-linux-gnueabihf-gcc"  >> "$GITHUB_ENV"
        echo "CXX=ccache arm-linux-gnueabihf-g++" >> "$GITHUB_ENV"
    - name: Seed kernel config and enable NAND/MTD/UBI
      run: |
        cp my-repo/config_files/config-aml-s812 linux-src/.config
        cd linux-src
        # Existing patch
        sed -i \
          's@# CONFIG_POSIX_MQUEUE is not set@CONFIG_POSIX_MQUEUE=y\nCONFIG_POSIX_MQUEUE_SYSCTL=y@g' \
          .config
        # Helper: safely enable a kernel config option regardless of current state
        patch_kconfig() {
          local key="$1"
          local val="$2"
          if grep -q "^# ${key} is not set" .config; then
            sed -i "s@^# ${key} is not set@${key}=${val}@g" .config
            echo "  enabled:  ${key}=${val}"
          elif grep -q "^${key}=" .config; then
            sed -i "s@^${key}=.*@${key}=${val}@g" .config
            echo "  updated:  ${key}=${val}"
          else
            echo "${key}=${val}" >> .config
            echo "  appended: ${key}=${val}"
          fi
        }
        echo "--- Enabling NAND / MTD / UBI kernel options ---"
        patch_kconfig CONFIG_MTD                     y
        patch_kconfig CONFIG_MTD_BLOCK               y
        patch_kconfig CONFIG_MTD_CHAR                y
        patch_kconfig CONFIG_MTD_OF_PARTS            y
        patch_kconfig CONFIG_MTD_CMDLINE_PARTS       y
        patch_kconfig CONFIG_MTD_NAND_CORE           y
        patch_kconfig CONFIG_MTD_NAND_ECC_SW_HAMMING y
        patch_kconfig CONFIG_MTD_NAND_MESON          y
        patch_kconfig CONFIG_MTD_UBI                 y
        patch_kconfig CONFIG_MTD_UBI_WL_THRESHOLD    4096
        patch_kconfig CONFIG_MTD_UBI_BEB_LIMIT       20
        patch_kconfig CONFIG_UBIFS_FS                y
        echo "--- Resolving config dependencies ---"
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
        echo "--- Verifying critical options ---"
        MISSING=0
        for key in CONFIG_MTD CONFIG_MTD_NAND_CORE CONFIG_MTD_NAND_MESON \
                   CONFIG_MTD_UBI CONFIG_UBIFS_FS CONFIG_MTD_OF_PARTS; do
          val=$(grep "^${key}=" .config 2>/dev/null || echo "NOT SET")
          echo "  ${key}: ${val}"
          [ "$val" = "NOT SET" ] && MISSING=$((MISSING+1))
        done
        if [ $MISSING -gt 0 ]; then
          echo "WARNING: $MISSING critical options not set — NAND may not work"
        else
          echo "All critical NAND options confirmed set."
        fi
    - name: Build kernel uImage, DTB, and modules
      run: |
        cd linux-src
        make -j$(nproc) \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          CC="$CC" \
          CXX="$CXX" \
          LOCALVERSION="-aml-s812" \
          LOADADDR=0x00208000 \
          uImage dtbs modules
        echo ""
        echo "=== Verifying meson8m2-m8s.dtb was built ==="
        if [ -f arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb ]; then
          ls -lh arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb
          echo "DTB build: OK"
        else
          echo "ERROR: meson8m2-m8s.dtb not found — DTS compilation failed!"
          echo "--- All Meson8 DTBs actually built ---"
          find arch/arm/boot/dts/amlogic/ -name "meson8*" 2>/dev/null || true
          exit 1
        fi
    - name: Upload standalone kernel artifacts (when Armbian skipped)
      if: ${{ inputs.skip_armbian == true }}
      uses: actions/upload-artifact@v7
      with:
        name: kernel-dtb-only-build${{ github.run_number }}
        path: |
          linux-src/arch/arm/boot/uImage
          linux-src/arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb
        retention-days: 7
        if-no-files-found: error
    
    - name: Show ccache statistics
      run: ccache --show-stats

    - name: Upload DTB as standalone artifact
      uses: actions/upload-artifact@v7
      with:
        name: meson8m2-m8s-dtb-build${{ github.run_number }}
        path: linux-src/arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb
        retention-days: 30
        if-no-files-found: error

    - name: Install kernel, DTB, and modules into image
      if: ${{ inputs.skip_armbian != true }}
      run: |
        IMAGE=$(ls armbian-build/output/images/*.img | head -1)
        echo "Target image: $IMAGE"
        mkdir -p /tmp/mnt_boot /tmp/mnt_root
        LOOP=$(sudo losetup --find --show --partscan "$IMAGE")
        echo "Loop device: $LOOP"
        sudo mount "${LOOP}p1" /tmp/mnt_boot
        sudo mount "${LOOP}p2" /tmp/mnt_root
        echo "=== Current boot partition contents ==="
        ls -lh /tmp/mnt_boot/
        # Back up old uImage if present
        [ -f /tmp/mnt_boot/uImage ] && \
          sudo cp /tmp/mnt_boot/uImage /tmp/mnt_boot/uImage.bak
        # Install uImage
        sudo cp linux-src/arch/arm/boot/uImage /tmp/mnt_boot/uImage
        echo "uImage installed."
        # Install DTB
        sudo cp \
          linux-src/arch/arm/boot/dts/amlogic/meson8m2-m8s.dtb \
          /tmp/mnt_boot/meson8m2-m8s.dtb
        echo "DTB installed: meson8m2-m8s.dtb"
        echo "=== Boot partition after install ==="
        ls -lh /tmp/mnt_boot/
        # Install kernel modules
        sudo make -C linux-src \
          ARCH=arm \
          CROSS_COMPILE=arm-linux-gnueabihf- \
          INSTALL_MOD_PATH=/tmp/mnt_root \
          modules_install
        # Save finalised .config to /boot
        sudo cp linux-src/.config /tmp/mnt_boot/config-6.20.0-aml-s812
        # Fix root partition label in boot config files
        for cfg in uEnv.txt boot.ini; do
          if sudo test -f "/tmp/mnt_boot/$cfg"; then
            sudo sed -i 's|root=LABEL=ROOTFS|root=LABEL=armbi_root|g' \
              "/tmp/mnt_boot/$cfg"
            echo "$cfg root label fixed."
          fi
        done
        if sudo test -f /tmp/mnt_boot/armbianEnv.txt; then
          sudo sed -i \
            's|rootdev=LABEL=ROOTFS|rootdev=LABEL=armbi_root|g' \
            /tmp/mnt_boot/armbianEnv.txt
          echo "armbianEnv.txt rootdev fixed."
        fi
        # Verify root partition label
        ROOT_LABEL=$(sudo e2label "${LOOP}p2" 2>/dev/null || echo "unknown")
        echo "Root partition (${LOOP}p2) label: ${ROOT_LABEL}"
        if [ "$ROOT_LABEL" != "armbi_root" ] && [ "$ROOT_LABEL" != "ROOTFS" ]; then
          echo "Setting root label to armbi_root"
          sudo e2label "${LOOP}p2" armbi_root
        fi
        # Install mtd-utils into rootfs
        echo "Installing mtd-utils into rootfs via chroot ..."
        sudo chroot /tmp/mnt_root /bin/bash -c "
          apt-get update -qq && \
          apt-get install -y --no-install-recommends mtd-utils && \
          apt-get clean
        " || echo "WARNING: mtd-utils install failed — install manually after boot"
        # Install flash-to-nand.sh helper script
        # Partition numbers based on real boot log layout:
        #   mtd0 = u-boot    (0x0000000, 16 MiB)
        #   mtd1 = logo      (0x1000000, 32 MiB)
        #   mtd2 = recovery  (0x3000000, 32 MiB)
        #   mtd3 = misc      (0x5000000, 32 MiB)
        #   mtd4 = boot      (0x7000000, 32 MiB)  <- kernel here
        #   mtd5 = system    (0x9000000,  1 GiB)  <- rootfs here
        #   mtd6 = cache     (0x49000000, 512 MiB)
        #   mtd7 = data      (0x69000000, rest)
        sudo tee /tmp/mnt_root/root/flash-to-nand.sh > /dev/null << 'FLASHSCRIPT'
        #!/usr/bin/env bash
        set -e
        
        RED='\033[0;31m'; YEL='\033[1;33m'; GRN='\033[0;32m'; NC='\033[0m'
        info()  { echo -e "${GRN}[INFO]${NC}  $*"; }
        warn()  { echo -e "${YEL}[WARN]${NC}  $*"; }
        error() { echo -e "${RED}[ERROR]${NC} $*"; exit 1; }
        
        [ "$(id -u)" -eq 0 ] || error "Run as root: sudo bash $0"
        command -v flash_erase >/dev/null || error "flash_erase not found. Run: apt install mtd-utils"
        command -v nandwrite   >/dev/null || error "nandwrite not found.   Run: apt install mtd-utils"
        command -v ubiformat   >/dev/null || error "ubiformat not found.   Run: apt install mtd-utils"
        
        echo ""
        info "=== Detected MTD devices ==="
        cat /proc/mtd 2>/dev/null || error "/proc/mtd missing — NAND driver not loaded. Check dmesg."
        echo ""
        
        # Confirm the partition names match what we expect
        if ! grep -q '"boot"' /proc/mtd || ! grep -q '"system"' /proc/mtd; then
          warn "Expected 'boot' and 'system' partitions not found in /proc/mtd"
          warn "The DTS partition table may be wrong. Check dmesg | grep -i nand"
          warn "Continuing anyway — verify mtd numbers manually before proceeding."
        fi
        
        # Resolve mtd numbers by partition name so this script is
        # resilient if partition order ever changes
        MTD_BOOT=$(grep '"boot"'   /proc/mtd | cut -d: -f1)   # e.g. mtd4
        MTD_SYS=$(grep '"system"' /proc/mtd | cut -d: -f1)    # e.g. mtd5
        
        info "Kernel partition : /dev/${MTD_BOOT}"
        info "Rootfs partition : /dev/${MTD_SYS}"
        echo ""
        
        confirm() {
          read -r -p "$1 [y/N] " ans
          [[ "$ans" =~ ^[Yy]$ ]] || { warn "Skipped."; return 1; }
        }
        
        # Step 1: Back up current NAND partitions before touching anything
        echo ""
        warn "=========================================================="
        warn " STEP 1: BACKUP (strongly recommended)"
        warn "=========================================================="
        if confirm "Back up current boot and system partitions to /root/?"; then
          info "Backing up /dev/${MTD_BOOT} → /root/boot-nand.bak ..."
          nanddump -f /root/boot-nand.bak /dev/${MTD_BOOT}
          info "Backing up /dev/${MTD_SYS} → /root/system-nand.bak ..."
          nanddump -f /root/system-nand.bak /dev/${MTD_SYS}
          info "Backup complete. Copy these to USB before proceeding!"
          confirm "Backups done — continue to flashing?" || exit 0
        fi
        
        # Step 2: Flash kernel to boot partition (mtd4)
        echo ""
        warn "=========================================================="
        warn " STEP 2: FLASH KERNEL → /dev/${MTD_BOOT}"
        warn "=========================================================="
        if confirm "Flash kernel (uImage) to /dev/${MTD_BOOT}?"; then
          read -r -p "Path to uImage [/boot/uImage]: " UIMAGE
          UIMAGE="${UIMAGE:-/boot/uImage}"
          [ -f "$UIMAGE" ] || error "File not found: $UIMAGE"
          info "Erasing /dev/${MTD_BOOT} ..."
          flash_erase /dev/${MTD_BOOT} 0 0
          info "Writing $UIMAGE ..."
          nandwrite -p /dev/${MTD_BOOT} "$UIMAGE"
          info "Kernel flashed OK."
        fi
        
        # Step 3: Flash rootfs to system partition (mtd5)
        echo ""
        warn "=========================================================="
        warn " STEP 3: FLASH ROOTFS → /dev/${MTD_SYS}"
        warn " Rootfs must be a UBI image (.ubi)"
        warn " NAND geometry: page=8192 block=1048576 (Samsung SDTNRGAMA-008G)"
        warn " Build with: ubinize -o rootfs.ubi -m 8192 -p 1048576 ubinize.cfg"
        warn "=========================================================="
        if confirm "Flash rootfs (.ubi) to /dev/${MTD_SYS}?"; then
          read -r -p "Path to rootfs.ubi: " ROOTFS_UBI
          [ -f "$ROOTFS_UBI" ] || error "File not found: $ROOTFS_UBI"
          info "Erasing /dev/${MTD_SYS} ..."
          flash_erase /dev/${MTD_SYS} 0 0
          info "Running ubiformat on /dev/${MTD_SYS} ..."
          ubiformat /dev/${MTD_SYS} -f "$ROOTFS_UBI" -m 8192 -p 1048576
          info "Rootfs flashed OK."
        fi
        
        # Step 4: Reminder for U-Boot env
        echo ""
        info "=========================================================="
        info " STEP 4: UPDATE U-Boot env via serial console"
        info ""
        info " setenv bootargs 'root=ubi0:rootfs rootfstype=ubifs"
        info "     ubi.mtd=5 console=ttyAML0,115200 rw'"
        info " setenv bootcmd 'imgread kernel boot \${loadaddr}; bootm'"
        info " saveenv"
        info " reset"
        info "=========================================================="
        info "All done."
        FLASHSCRIPT
        sudo chmod +x /tmp/mnt_root/root/flash-to-nand.sh
        echo "flash-to-nand.sh installed to /root/flash-to-nand.sh"
        sudo umount /tmp/mnt_boot
        sudo umount /tmp/mnt_root
        sudo losetup -d "$LOOP"
        echo "All files installed into image successfully."
    - name: Compress image with xz
      run: |
        IMAGE=$(ls armbian-build/output/images/*.img | head -1)
        sudo xz -T0 -v "$IMAGE"
        ls -lh armbian-build/output/images/
    - name: Upload full image as artifact
      if: ${{ inputs.skip_armbian != true }}
      uses: actions/upload-artifact@v7
      with:
        name: armbian-trixie-linux620-m8s-build${{ github.run_number }}
        path: armbian-build/output/images/*.xz
        retention-days: 7
        if-no-files-found: error
