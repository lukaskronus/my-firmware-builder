name: Build Pure TTL Package with Pre-built Kernel (6.19.0-rc3+)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Download Original TTL Package
      run: |
        wget --no-check-certificate -c "https://node4.histb.com:9088/update/system/TTL-hi3798mv100-32bit.zip" -O original_ttl.zip
        unzip -l original_ttl.zip | head -10

    - name: 3. Extract Original Package
      run: |
        mkdir -p ttl_template
        unzip -q original_ttl.zip -d ttl_template/
        ls -la ttl_template/

    - name: 4. Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static debootstrap e2fsprogs zip \
          u-boot-tools p7zip-full

    - name: 5. Setup Pre-built Kernel and Modules
      run: |
        # Copy uImage
        if [ -f "${GITHUB_WORKSPACE}/prebuilt/uImage" ]; then
          echo "Using pre-built uImage from prebuilt directory"
          cp "${GITHUB_WORKSPACE}/prebuilt/uImage" "${GITHUB_WORKSPACE}/new_uImage"
        elif [ -f "${GITHUB_WORKSPACE}/uImage" ]; then
          echo "Using pre-built uImage from workspace root"
          cp "${GITHUB_WORKSPACE}/uImage" "${GITHUB_WORKSPACE}/new_uImage"
        else
          echo "ERROR: No uImage found!"
          exit 1
        fi
    
        # === Extract Kernel Modules ===
        echo "=== Kernel Modules Extraction ==="
        ARCHIVE="${GITHUB_WORKSPACE}/prebuilt/6.19.0-rc3+.7z"
    
        if [ ! -f "$ARCHIVE" ]; then
          echo "ERROR: Modules archive not found: $ARCHIVE"
          ls -la "${GITHUB_WORKSPACE}/prebuilt/" || true
          exit 1
        fi
    
        mkdir -p "${GITHUB_WORKSPACE}/kernel_modules_temp"
        echo "Extracting $ARCHIVE ..."
        7z l "$ARCHIVE" | head -n 50                    # Important: shows internal structure
    
        7z x "$ARCHIVE" -o"${GITHUB_WORKSPACE}/kernel_modules_temp/" -y
    
        echo "Extracted directory tree:"
        find "${GITHUB_WORKSPACE}/kernel_modules_temp" -type d | head -n 30
    
        # Prepare target
        mkdir -p "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules"
    
        # Robust handling of common archive layouts
        if [ -d "${GITHUB_WORKSPACE}/kernel_modules_temp/lib/modules/6.19.0-rc3" ]; then
          echo "✓ Found perfect structure (lib/modules/6.19.0-rc3)"
          cp -a "${GITHUB_WORKSPACE}/kernel_modules_temp/lib/modules/6.19.0-rc3" \
                "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/"
        elif [ -d "${GITHUB_WORKSPACE}/kernel_modules_temp/lib/modules/6.19.0-rc3+" ]; then
          echo "✓ Found 6.19.0-rc3+ directory, renaming to 6.19.0-rc3"
          cp -a "${GITHUB_WORKSPACE}/kernel_modules_temp/lib/modules/6.19.0-rc3+" \
                "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/6.19.0-rc3"
        elif [ -d "${GITHUB_WORKSPACE}/kernel_modules_temp/6.19.0-rc3" ]; then
          echo "✓ Found top-level 6.19.0-rc3 directory"
          cp -a "${GITHUB_WORKSPACE}/kernel_modules_temp/6.19.0-rc3" \
                "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/"
        elif [ -d "${GITHUB_WORKSPACE}/kernel_modules_temp/lib" ]; then
          echo "✓ Found top-level lib directory"
          cp -a "${GITHUB_WORKSPACE}/kernel_modules_temp/lib" \
                "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/"
        else
          echo "⚠ Unknown structure - copying everything"
          cp -a "${GITHUB_WORKSPACE}/kernel_modules_temp/"* \
                "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/" 2>/dev/null || true
        fi
    
        # Verification
        echo "=== Final Modules Structure in kernel_build ==="
        ls -la "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/" || echo "No modules directory!"
        if [ -d "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/6.19.0-rc3" ]; then
          echo "✓ SUCCESS: 6.19.0-rc3 directory is ready"
          ls -la "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/6.19.0-rc3/" | head -n 15
        fi

    - name: 6. Build Pure Debian 13 Trixie Rootfs
      run: |
        chmod +x build_rootfs.sh
        ./build_rootfs.sh

    - name: 7. Install Kernel Modules into Debian Rootfs
      run: |
        ROOTFS_DIR="$(pwd)/pure_rootfs"
        
        if [ -d "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/6.19.0-rc3" ]; then
          echo "Installing kernel modules into rootfs..."
          sudo mkdir -p "$ROOTFS_DIR/lib/modules"
          
          sudo cp -a "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/6.19.0-rc3" \
                     "$ROOTFS_DIR/lib/modules/"
          
          echo "Installed modules:"
          ls -la "$ROOTFS_DIR/lib/modules/"
          
          # Run depmod
          KERNEL_VERSION="6.19.0-rc3"
          echo "Running depmod for $KERNEL_VERSION..."
          sudo mount -t proc none "$ROOTFS_DIR/proc" 2>/dev/null || true
          sudo mount -t sysfs none "$ROOTFS_DIR/sys" 2>/dev/null || true
          sudo mount -t devtmpfs none "$ROOTFS_DIR/dev" 2>/dev/null || true
          
          sudo chroot "$ROOTFS_DIR" depmod -a "$KERNEL_VERSION" || echo "depmod finished with warnings"
          
          sudo umount "$ROOTFS_DIR/proc" "$ROOTFS_DIR/sys" "$ROOTFS_DIR/dev" 2>/dev/null || true
        else
          echo "WARNING: Expected modules directory 6.19.0-rc3 not found!"
          ls -la "${GITHUB_WORKSPACE}/kernel_build/kernel_modules/lib/modules/" || true
        fi

    - name: 8. Create Pure Rootfs Image
      run: |
        ORIG_SIZE=$(stat -c%s "ttl_template/rootfs-32.img" || echo "104857600")
        
        # Use a safe default if original size can't be determined
        if [ "$ORIG_SIZE" -lt 1048576 ]; then
          ORIG_SIZE=209715200  # 200MB fallback
        fi
        
        echo "Creating rootfs image of size: $ORIG_SIZE bytes ($((ORIG_SIZE / 1048576))MB)"
        dd if=/dev/zero of=rootfs-32-pure.img bs=1 count=0 seek=$ORIG_SIZE
        mkfs.ext4 -F -L "rootfs" rootfs-32-pure.img
        
        mkdir -p temp_mount
        sudo mount -o loop rootfs-32-pure.img temp_mount
        sudo cp -a pure_rootfs/* temp_mount/
        sync
        sudo umount temp_mount
        
        ls -lh rootfs-32-pure.img

    - name: 9. Package Final TTL
      run: |
        cp -r ttl_template/ final_package/
        cp rootfs-32-pure.img final_package/rootfs-32.img
        cp new_uImage final_package/uImage
        
        cd final_package
        zip -r ../TTL-hi3798mv100-32bit-Trixie-$(date +%Y%m%d).zip .
        cd ..
        
        ls -lh TTL-hi3798mv100-32bit-Trixie-*.zip

    - name: 10. Upload Artifacts - Complete TTL Package
      uses: actions/upload-artifact@v4
      with:
        name: ttl-package-trixie
        path: TTL-hi3798mv100-32bit-Trixie-*.zip
        retention-days: 7

    - name: 11. Upload Artifacts - Rootfs Image
      uses: actions/upload-artifact@v4
      with:
        name: rootfs-image-trixie
        path: rootfs-32-pure.img
        retention-days: 7

    - name: 12. Upload Artifacts - Kernel uImage
      uses: actions/upload-artifact@v4
      with:
        name: kernel-uimage-6.19.0-rc3
        path: new_uImage
        retention-days: 7
