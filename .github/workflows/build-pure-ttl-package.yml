name: Build Pure TTL Package with Mainline Kernel (V6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Download Original TTL Package
      run: |
        wget --no-check-certificate -c "https://node4.histb.com:9088/update/system/TTL-hi3798mv100-32bit.zip" -O original_ttl.zip
        unzip -l original_ttl.zip | head -10

    - name: 3. Extract Original Package
      run: |
        mkdir -p ttl_template
        unzip -q original_ttl.zip -d ttl_template/
        ls -la ttl_template/

    - name: 4. Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static debootstrap e2fsprogs zip \
          gcc-arm-linux-gnueabihf u-boot-tools bc bison flex libssl-dev \
          libncurses5-dev zlib1g-dev device-tree-compiler

    - name: 5.1. Setup Kernel Build Cache
      uses: actions/cache@v3
      with:
        path: kernel_build/mainline
        key: kernel-mainline-${{ hashFiles('config_files/hi3798mv100-v6.config') }}-${{ runner.os }}
        restore-keys: |
          kernel-mainline-${{ runner.os }}-
          kernel-mainline-

    - name: 5.2. Clone Mainline Kernel Repository (if not cached)
      run: |
        if [ ! -d "kernel_build/mainline" ]; then
          mkdir -p kernel_build
          cd kernel_build
          git clone --single-branch --depth=1 https://github.com/histb-mainline/linux mainline
          echo "Mainline kernel repository cloned"
        else
          echo "Using cached kernel repository"
          cd kernel_build/mainline
          git pull --depth=1
        fi
        ls -la kernel_build/mainline/ | head -20

    - name: 5.3. Copy Kernel Configuration
      run: |
        cd kernel_build/mainline
        
        echo "=== Copying custom kernel config from config_files ==="
        if [ -f "${GITHUB_WORKSPACE}/config_files/hi3798mv100-v6.config" ]; then
          cp -v "${GITHUB_WORKSPACE}/config_files/hi3798mv100-v6.config" .config
          echo "Custom kernel config applied"
        else
          echo "ERROR: Kernel config not found at config_files/hi3798mv100-v6.config"
          exit 1
        fi
        
        echo "=== Copying custom DTS file (if exists) ==="
        if [ -f "${GITHUB_WORKSPACE}/config_files/hi3798mv100-v6.dts" ]; then
          cp -v "${GITHUB_WORKSPACE}/config_files/hi3798mv100-v6.dts" arch/arm/boot/dts/hi3798mv100.dts
          echo "Custom DTS applied"
        else
          echo "WARNING: Custom DTS not found, using existing DTS"
        fi
        
        echo "=== Running olddefconfig to resolve any dependencies ==="
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
        
        echo "=== Verifying key configuration options ==="
        echo "F2FS status:"
        grep "CONFIG_F2FS_FS" .config || echo "F2FS is disabled (recommended)"
        echo ""
        echo "GPU status:"
        grep "CONFIG_DRM_LIMA" .config || echo "GPU drivers disabled"
        echo ""
        echo "MMC debug status:"
        grep "CONFIG_MMC_DEBUG" .config || echo "MMC debug disabled"
        echo ""
        echo "PSCI status:"
        grep "CONFIG_ARM_PSCI" .config || echo "PSCI disabled"
        
    - name: 5.4. Build Kernel
      run: |
        cd kernel_build/mainline
        echo "Building with $(nproc) cores..."
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc) 2>&1 | tee build.log
    
        echo "=== Checking outputs ==="
        ls -lh arch/arm/boot/Image arch/arm/boot/zImage || true
        ls -lh arch/arm/boot/dts/*.dtb || true
    
        if [ ! -f arch/arm/boot/zImage ]; then
          echo "ERROR: zImage not found!"
          exit 1
        fi
        if [ ! -f arch/arm/boot/dts/hi3798mv100.dtb ]; then
          echo "WARNING: hi3798mv100.dtb not found, looking for any dtb..."
          find arch/arm/boot/dts/ -name "*.dtb" | head -5
        fi

    - name: 5.5. Create uImage
      run: |
        cd kernel_build/mainline
    
        ZIMAGE="arch/arm/boot/zImage"
        DTB="arch/arm/boot/dts/hi3798mv100.dtb"
        
        # Try alternative DTB names if the exact name doesn't exist
        if [ ! -f "$DTB" ]; then
          echo "Looking for alternative DTB files..."
          DTB=$(find arch/arm/boot/dts/ -name "hi3798mv100*.dtb" | head -1)
          if [ -z "$DTB" ]; then
            echo "ERROR: No hi3798mv100 DTB found!"
            exit 1
          fi
          echo "Using DTB: $DTB"
        fi
    
        if [ ! -f "$ZIMAGE" ]; then
          echo "ERROR: zImage not found!"
          ls -lh arch/arm/boot/
          exit 1
        fi
    
        ZIMAGE_SIZE=$(stat -c%s "$ZIMAGE")
        DTB_SIZE=$(stat -c%s "$DTB")
        echo "zImage size: $ZIMAGE_SIZE bytes (~$(( ZIMAGE_SIZE / 1024 / 1024 ))MB)"
        echo "DTB size:    $DTB_SIZE bytes"
    
        if [ "$ZIMAGE_SIZE" -lt 3000000 ]; then
          echo "ERROR: zImage too small, build may have failed"
          exit 1
        fi
    
        echo "Concatenating zImage + DTB..."
        cat "$ZIMAGE" "$DTB" > zImage-dtb
    
        echo "Creating uImage..."
        mkimage -A arm -O linux -T kernel -C none \
          -a 0x2000000 -e 0x2000000 \
          -n linux -d zImage-dtb uImage
    
        ls -lh uImage

    - name: 5.6. Verify Kernel Size Fits Partition
      run: |
        cd kernel_build/mainline
        
        KERNEL_SIZE=$(stat -c%s uImage)
        KERNEL_SIZE_MB=$(echo "scale=2; $KERNEL_SIZE / 1048576" | bc)
        MAX_SIZE=$((30 * 1048576))
        
        echo "=== Kernel Size Check ==="
        echo "New kernel size: ${KERNEL_SIZE_MB}MB"
        echo "Partition size: 30MB"
        echo "Remaining space: $(echo "scale=2; (30 - $KERNEL_SIZE_MB)" | bc)MB"
        
        if [ $KERNEL_SIZE -gt $MAX_SIZE ]; then
          echo "ERROR: Kernel too large for 30MB partition!"
          exit 1
        fi
        
        echo "✓ Kernel fits in partition"

    - name: 5.7. Build Kernel Modules and Headers
      run: |
        cd kernel_build/mainline
        
        echo "Building kernel modules..."
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- INSTALL_MOD_STRIP=1 INSTALL_MOD_PATH=../kernel_modules modules_install
        
        echo "Installing kernel headers..."
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- INSTALL_HDR_PATH=../kernel_headers headers_install
        
        echo "Modules and headers completed"

    - name: 5.8. Package Kernel Build Artifacts
      run: |
        cd kernel_build
        
        tar -zcvf linux-build.tar.gz kernel_headers kernel_modules
        ls -lh linux-build.tar.gz

    - name: 5.9. Copy uImage to Workspace
      run: |
        cp kernel_build/mainline/uImage ${GITHUB_WORKSPACE}/new_uImage
        ls -lh ${GITHUB_WORKSPACE}/new_uImage

    - name: 6. Build Pure Debian 13 Trixie Rootfs
      run: |
        chmod +x build_rootfs.sh
        # Update build_rootfs.sh for Debian 13 Trixie
        sed -i 's/bookworm/trixie/g' build_rootfs.sh
        sed -i 's/Debian 12/Debian 13/g' build_rootfs.sh
        ./build_rootfs.sh

    - name: 7. Install Kernel Modules into Debian Rootfs
      run: |
        ROOTFS_DIR=$(pwd)/pure_rootfs
        
        echo "Installing kernel modules into Debian rootfs..."
        sudo mkdir -p "$ROOTFS_DIR/lib/modules"
        
        # Extract and install modules
        sudo tar -xzf kernel_build/linux-build.tar.gz -C /tmp
        
        # Find and copy the kernel module directory
        MODULE_DIR=$(ls -d /tmp/kernel_modules/lib/modules/*/ 2>/dev/null | head -1)
        if [ -n "$MODULE_DIR" ]; then
          sudo cp -a "$MODULE_DIR"* "$ROOTFS_DIR/lib/modules/"
          echo "Modules installed from: $MODULE_DIR"
        else
          echo "WARNING: No modules found in /tmp/kernel_modules/lib/modules/"
          ls -la /tmp/kernel_modules/lib/modules/ || true
        fi
        
        # Run depmod in chroot
        sudo mount -t proc none "$ROOTFS_DIR/proc" || true
        sudo mount -t sysfs none "$ROOTFS_DIR/sys" || true
        sudo chroot "$ROOTFS_DIR" depmod -a 2>&1 || echo "depmod warnings are normal during cross-build"
        sudo umount "$ROOTFS_DIR/proc" "$ROOTFS_DIR/sys" 2>/dev/null || true

    - name: 8. Create Pure Rootfs Image
      run: |
        ORIG_SIZE=$(stat -c%s "ttl_template/rootfs-32.img" || echo "104857600")
        
        # Use a safe default if original size can't be determined
        if [ "$ORIG_SIZE" -lt 1048576 ]; then
          ORIG_SIZE=209715200  # 200MB fallback
        fi
        
        dd if=/dev/zero of=rootfs-32-pure.img bs=1 count=0 seek=$ORIG_SIZE
        mkfs.ext4 -F -L "rootfs" rootfs-32-pure.img
        
        mkdir -p temp_mount
        sudo mount -o loop rootfs-32-pure.img temp_mount
        sudo cp -a pure_rootfs/* temp_mount/
        sync
        sudo umount temp_mount
        
        ls -lh rootfs-32-pure.img

    - name: 9. Replace Kernel and Package Final TTL
      run: |
        cp -r ttl_template/ final_package/
        cp rootfs-32-pure.img final_package/rootfs-32.img
        cp new_uImage final_package/uImage || cp new_uImage final_package/boot/uImage || true
        
        cd final_package
        zip -r ../TTL-hi3798mv100-32bit-MAINLINE-Trixie-$(date +%Y%m%d).zip .
        cd ..
        
        ls -lh TTL-hi3798mv100-32bit-MAINLINE-Trixie-*.zip

    - name: 10. Upload Artifacts - Kernel uImage
      uses: actions/upload-artifact@v4
      with:
        name: kernel-uimage-mainline
        path: new_uImage
        retention-days: 7

    - name: 11. Upload Artifacts - Rootfs Image
      uses: actions/upload-artifact@v4
      with:
        name: rootfs-image-trixie
        path: rootfs-32-pure.img
        retention-days: 7

    - name: 12. Upload Artifacts - Complete TTL Package
      uses: actions/upload-artifact@v4
      with:
        name: ttl-package-mainline
        path: TTL-hi3798mv100-32bit-MAINLINE-Trixie-*.zip
        retention-days: 7

    - name: 13. Upload Artifacts - Build Logs
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-mainline
        path: kernel_build/mainline/build.log
        retention-days: 7

    - name: 14. Upload Artifacts - Kernel Config
      uses: actions/upload-artifact@v4
      with:
        name: kernel-config
        path: kernel_build/mainline/.config
        retention-days: 7
