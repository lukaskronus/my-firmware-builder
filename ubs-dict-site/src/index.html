<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UBS Biblical Dictionary</title>
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (error) {}
  var theme = (stored === 'light' || stored === 'dark')
    ? stored
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta name="description" content="Look up Biblical Hebrew and New Testament Greek words: glosses, definitions, semantic domains, and occurrences.">
<meta name="theme-color" content="#faf6ee">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-head">
  <a class="brand" href="#/">UBS Biblical Dictionary</a>
  <nav aria-label="Main">
    <a href="#/search?c=h">Hebrew</a>
    <a href="#/search?c=g">Greek</a>
    <a href="#/domains/h">Domains</a>
    <a href="#/about">About</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
</header>
<main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
<footer class="site-foot">
  <p>Dictionary content © United Bible Societies, <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener" target="_blank">CC BY-SA 4.0</a>. <a href="#/about">Sources &amp; attribution</a>.</p>
</footer>
<script src="app.js" defer></script>
</body>
</html>
