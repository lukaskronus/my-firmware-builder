%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/hisilicon,hi3798mv100-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 thermal sensor

maintainers:
  - Kobayashi <koba@somedco.eu.org>

description: |
  The Hi3798MV100 temperature sensor is part of the PMOC block.  Writing
  PMC10 starts a conversion and PMC12..PMC13 then hold eight 8-bit samples.

allOf:
  - $ref: thermal-sensor.yaml

properties:
  compatible:
    const: hisilicon,hi3798mv100-tsensor

  reg:
    maxItems: 1

  "#thermal-sensor-cells":
    const: 0

required:
  - compatible
  - reg
  - "#thermal-sensor-cells"

unevaluatedProperties: false

examples:
  - |
    thermal-sensor@8a23028 {
        compatible = "hisilicon,hi3798mv100-tsensor";
        reg = <0x8a23028 0x18>;
        #thermal-sensor-cells = <0>;
    };

...
