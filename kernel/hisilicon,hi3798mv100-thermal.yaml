%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/hisilicon,hi3798mv100-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 thermal sensor

maintainers:
  - David Yang <mmyangfl@gmail.com>

description: |
  The Hi3798MV100 temperature sensor is part of the PMOC block.  It
  provides eight 8-bit samples through two registers.  A per-chip trim
  value is read from the OTP block.

allOf:
  - $ref: thermal-sensor.yaml

properties:
  compatible:
    const: hisilicon,hi3798mv100-tsensor

  reg:
    items:
      - description: PMOC temperature registers
      - description: OTP registers

  reg-names:
    items:
      - const: pmoc
      - const: otp

  "#thermal-sensor-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - "#thermal-sensor-cells"

unevaluatedProperties: false

examples:
  - |
    thermal-sensor@8a23028 {
        compatible = "hisilicon,hi3798mv100-tsensor";
        reg = <0x8a23028 0x10>, <0x8ab0000 0x1000>;
        reg-names = "pmoc", "otp";
        #thermal-sensor-cells = <0>;
    };

...
